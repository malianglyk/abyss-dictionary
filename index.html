<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyss Lexicon: The Hundred-Room Abyss</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #1e1e30;
  --gold: #c9a050;
  --gold-dim: #6b4e20;
  --red: #c0392b;
  --red-glow: #e74c3c;
  --blue: #2980b9;
  --green: #27ae60;
  --purple: #8e44ad;
  --text: #c8c8d0;
  --text-dim: #6a6a7a;
  --terminal-bg: #08080f;
  --map-height: 35vh;
  --battle-height: 35vh;
  --terminal-height: 30vh;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  height: 100vh; overflow: hidden;
  user-select: none;
}
/* Particles */
#particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
/* Title Screen */
#title-screen {
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at center, #1a1020 0%, #0a0a0f 70%);
}
#title-screen h1 {
  font-size:3em; color:var(--gold); text-shadow:0 0 40px rgba(201,160,80,0.5);
  letter-spacing:0.1em; margin-bottom:0.3em;
}
#title-screen .subtitle { color:var(--text-dim); font-size:1.1em; margin-bottom:2em; }
#title-screen .wordbank-select { margin-bottom:2em; text-align:center; }
#title-screen .wordbank-select label { color:var(--text-dim); display:block; margin-bottom:0.5em; }
#title-screen select {
  background:var(--surface); color:var(--gold); border:1px solid var(--gold-dim);
  padding:0.8em 2em; font-size:1.1em; cursor:pointer; border-radius:4px;
}
#title-screen button {
  background: transparent; color:var(--gold); border:2px solid var(--gold);
  padding:1em 3em; font-size:1.3em; cursor:pointer; letter-spacing:0.1em;
  transition: all 0.3s; border-radius:4px;
}
#title-screen button:hover { background:var(--gold); color:var(--bg); box-shadow:0 0 30px rgba(201,160,80,0.4); }
#title-screen .mastered-count { color:var(--text-dim); margin-top:1em; font-size:0.9em; }
/* Game Layout */
#game-screen { display:none; height:100vh; flex-direction:column; position:relative; z-index:1; }
/* Top: Map */
#map-area {
  height:var(--map-height); border-bottom:2px solid var(--border);
  background: linear-gradient(180deg, rgba(20,10,30,0.9) 0%, rgba(10,10,15,0.95) 100%);
  position:relative; overflow:hidden; padding:10px 20px;
}
#map-title { color:var(--text-dim); font-size:0.85em; margin-bottom:8px; display:flex; justify-content:space-between; }
#map-title span { color:var(--gold); }
#map-nodes { display:flex; align-items:center; gap:6px; height:calc(100% - 30px); overflow-x:auto; padding-bottom:10px; }
.map-node {
  min-width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.7em; font-weight:bold; cursor:pointer; transition:all 0.3s; position:relative;
  flex-shrink:0; border:2px solid transparent;
}
.map-node.current { border-color:var(--gold); box-shadow:0 0 20px rgba(201,160,80,0.6); animation: pulse-node 1.5s infinite; }
.map-node.visited { opacity:0.5; }
.map-node.battle { background:#1a1020; border-color:#c0392b; color:#e74c3c; }
.map-node.event { background:#101a20; border-color:#2980b9; color:#3498db; }
.map-node.shop { background:#1a1a10; border-color:#c9a050; color:#f1c40f; }
.map-node.rest { background:#101a10; border-color:#27ae60; color:#2ecc71; }
.map-node.spring { background:#1a1025; border-color:#8e44ad; color:#9b59b6; }
.map-node.trap { background:#1a1010; border-color:#666; color:#999; }
.map-node.boss { background:#200808; border-color:#ff0000; color:#ff4444; min-width:52px; height:52px; font-size:0.85em; }
.map-node.branch { border-style:dashed; }
.map-path { min-width:20px; height:2px; background:var(--border); flex-shrink:0; }
.map-path.active { background:var(--gold); }
@keyframes pulse-node { 0%,100% { box-shadow:0 0 20px rgba(201,160,80,0.6); } 50% { box-shadow:0 0 35px rgba(201,160,80,1); } }
/* Middle: Battle */
#battle-area {
  height:var(--battle-height); background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden; border-bottom:2px solid var(--border);
}
#battle-scene { text-align:center; width:80%; max-width:600px; }
#battle-scene .room-label { color:var(--text-dim); font-size:0.85em; margin-bottom:0.5em; }
#battle-scene .scene-title { color:var(--gold); font-size:1.4em; margin-bottom:0.5em; }
#battle-scene .scene-desc { color:var(--text-dim); font-size:0.9em; margin-bottom:1em; }
#monster-list { width:100%; }
.monster-row {
  display:flex; align-items:center; padding:8px 16px; margin:4px 0;
  background:rgba(20,15,25,0.8); border:1px solid var(--border); border-radius:4px;
  transition:all 0.3s;
}
.monster-row.active { border-color:var(--gold); background:rgba(201,160,80,0.1); box-shadow:0 0 15px rgba(201,160,80,0.3); }
.monster-row.defeated { opacity:0.3; text-decoration:line-through; }
.monster-row .monster-word { font-size:1.3em; color:#e8e8f0; flex:1; }
.monster-row .monster-hint { font-size:0.8em; color:var(--text-dim); margin-left:10px; }
.monster-row .monster-status { font-size:0.8em; margin-left:10px; }
/* Bottom: Terminal */
#terminal-area {
  height:var(--terminal-height); background:var(--terminal-bg);
  display:flex; flex-direction:column; padding:8px 16px;
}
#status-bar {
  display:flex; gap:20px; padding:4px 0; font-size:0.85em; color:var(--text-dim);
  border-bottom:1px solid var(--border); margin-bottom:6px; flex-wrap:wrap;
}
#status-bar .stat { display:flex; align-items:center; gap:4px; }
#status-bar .stat .icon { font-size:1.1em; }
#status-bar .stat .val { color:var(--text); font-weight:bold; }
#log-area { flex:1; overflow-y:auto; font-family:'Consolas','Courier New',monospace; font-size:0.82em; padding:4px 0; }
.log-line { padding:2px 0; animation:fadeInLog 0.3s; }
.log-line.system { color:var(--text-dim); }
.log-line.correct { color:#2ecc71; }
.log-line.wrong { color:#e74c3c; }
.log-line.gold { color:#f1c40f; }
.log-line.info { color:#3498db; }
@keyframes fadeInLog { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
#input-line { display:flex; align-items:center; padding:6px 0; border-top:1px solid var(--border); }
#input-line .prompt { color:var(--gold); font-family:'Consolas',monospace; margin-right:8px; font-weight:bold; }
#cmd-input {
  flex:1; background:transparent; border:none; color:#e8e8f0; font-family:'Consolas',monospace;
  font-size:1em; outline:none; caret-color:var(--gold);
}
#cmd-input::placeholder { color:var(--text-dim); }
/* Overlays */
.overlay {
  position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.overlay h2 { color:var(--gold); font-size:2em; margin-bottom:0.5em; text-shadow:0 0 30px rgba(201,160,80,0.5); }
.overlay p { color:var(--text-dim); margin-bottom:1em; }
.overlay button {
  background:transparent; color:var(--gold); border:1px solid var(--gold);
  padding:0.8em 2em; font-size:1.1em; cursor:pointer; margin:0.5em; border-radius:4px;
  transition:all 0.3s;
}
.overlay button:hover { background:var(--gold); color:var(--bg); }
/* Event/Shop choices */
#choice-area { display:flex; gap:10px; margin-top:10px; }
#choice-area button {
  background:rgba(30,20,40,0.9); color:var(--text); border:1px solid var(--border);
  padding:0.6em 1.2em; cursor:pointer; border-radius:4px; transition:all 0.3s; font-size:0.9em;
}
#choice-area button:hover { border-color:var(--gold); color:var(--gold); }
/* Animations */
.float-text {
  position:absolute; pointer-events:none; font-weight:bold; font-size:1.2em;
  animation: floatUp 1.5s forwards; z-index:50;
}
@keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-80px); } }
.shake { animation: shake 0.5s; }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
.flash-red { animation:flashRed 0.3s; }
@keyframes flashRed { 0%,100% { background:transparent; } 50% { background:rgba(231,76,60,0.2); } }
/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <h1>Abyss Lexicon</h1>
  <p class="subtitle">The Hundred-Room Abyss</p>
  <div class="wordbank-select">
    <label>Word Bank</label>
    <select id="wordbank-select">
      <option value="sat">SAT Digital Reading Vocab (100 words)</option>
    </select>
  </div>
  <button onclick="startGame()">Enter the Abyss</button>
  <p class="mastered-count" id="mastered-count-display">Mastered: 0 / 100</p>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div id="map-area">
    <div id="map-title"><span>▸ Abyss Trail</span> <span id="floor-label">Floor 1</span> <span id="room-progress">1 / 20</span></div>
    <div id="map-nodes"></div>
  </div>
  <div id="battle-area">
    <div id="battle-scene"></div>
    <div id="choice-area"></div>
  </div>
  <div id="terminal-area">
    <div id="status-bar">
      <span class="stat"><span class="icon">❤️</span> <span class="val" id="hp-val">10</span></span>
      <span class="stat"><span class="icon">🛡️</span> <span class="val" id="shield-val">1</span></span>
      <span class="stat"><span class="icon">✨</span> <span class="val" id="spirit-val">3</span></span>
      <span class="stat"><span class="icon">🪙</span> <span class="val" id="gold-val">0</span></span>
      <span class="stat"><span class="icon">📖</span> <span class="val" id="mastered-val">0/100</span></span>
      <span class="stat" style="margin-left:auto;"><span class="icon">🎒</span> <span id="inventory-display">Empty</span></span>
    </div>
    <div id="log-area"></div>
    <div id="input-line">
      <span class="prompt">&gt;</span>
      <input id="cmd-input" type="text" placeholder="Type Chinese meaning... (Tab = use scroll)" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<!-- OVERLAYS -->
<div id="overlay-container"></div>

<script>

const WORD_DATA = [{"w":"efficacy","m":"功效；有效性","p":"/ˈefɪkəsi/","s":"The placebo effect challenges conventional ideas about medical treatment efficacy.","sc":"安慰剂效应挑战了人们对医疗治疗效力的传统观念。","a":["功效","有效性"]},{"w":"prohibitive","m":"高得令人却步的；起阻止作用的","p":"/prəˈhɪbɪtɪv/","s":"Right now the expense is prohibitive, but researchers are searching for low-cost solutions.","sc":"眼下这笔开销高得令人望而却步，但研究人员正在寻找低成本解决方案。","a":["高得令人却步的","起阻止作用的"]},{"w":"distinctive","m":"独特的；易于辨认的","p":"/dɪˈstɪŋk.tɪv/","s":"Then, I noticed the distinctive smell of rotting meat.","sc":"然后，我注意到了腐烂肉类的独特气味。","a":["独特的","易于辨认的"]},{"w":"convey","m":"传达；表达","p":"/kənˈveɪ/","s":"Art can convey powerful messages and provoke thought and discussion about important social and cultural issues.","sc":"艺术能够传达强有力的信息，并引发对重要社会和文化问题的思考与讨论。","a":["传达","表达"]},{"w":"misconstrue","m":"误解；曲解","p":"/ˌmɪskənˈstruː/","s":"They may misconstrue his silence as anger.","sc":"他们也许会把他的沉默误解为生气。","a":["误解","曲解"]},{"w":"disseminate","m":"传播；散布","p":"/dɪˈsemɪneɪt/","s":"We must disseminate the news quickly.","sc":"我们必须迅速传播这消息。","a":["传播","散布"]},{"w":"disregard","m":"忽视；不理会","p":"/ˌdɪsrɪˈɡɑːd/","s":"It is a testimony to Jin's abilities that the novel manages to be engrossing despite its total disregard for narrative tension.","sc":"这部小说尽管完全不顾叙事张力，仍然引人入胜，这证明了金的才华。","a":["忽视","不理会"]},{"w":"curiosity","m":"好奇心；求知欲","p":"/ˌkjʊəriˈɒsəti/","s":"Many scientists share this curiosity about the age of inanimate objects like rocks, fossils and precious stones.","sc":"许多科学家都对岩石、化石和宝石等无生命物体的年龄怀有这种好奇心。","a":["好奇心","求知欲"]},{"w":"candor","m":"坦率；直言不讳","p":"/ˈkændə/","s":"Its young mix of writers, thinkers, and artists stood at the vanguard of a shift in manners away from nineteenth-century formality and reticence and toward twentieth-century candor and playfulness.","sc":"那群年轻的作家、思想家和艺术家走在风气转变的前沿，使礼仪从十九世纪的拘谨和矜持，转向二十世纪的坦率与俏皮。","a":["坦率","直言不讳"]},{"w":"individually","m":"单独地；分别地","p":"/ˌɪndɪˈvɪdʒuəli/","s":"However, gradually he got to know them individually and became close friends with them.","sc":"然而，渐渐地他逐个认识了他们，并和他们成了亲密朋友。","a":["单独地","分别地"]},{"w":"buttress","m":"支持；加强","p":"/ˈbʌtrəs/","s":"The old stone wall leaned on a buttress for support.","sc":"那道旧石墙靠着一座扶壁获得支撑。","a":["支持","加强"]},{"w":"heterogeneous","m":"异质的；由不同成分组成的","p":"/ˌhetərəˈdʒiːniəs/","s":"The reports in the nineteenth-century press reveal a heterogeneous world of dock labour.","sc":"十九世纪报刊中的报道揭示了一个异质而混杂的码头劳工世界。","a":["异质的","由不同成分组成的"]},{"w":"reverence","m":"崇敬；敬畏","p":"/ˈrevərəns/","s":"Because of the trained patterns of response, you are (or are not) stirred to patriotism by martial music, your feelings of reverence are aroused by symbols of your religion, you listen more respectfully to the health advice of someone who has \\\"MD\\\" after his name than to that of someone who hasn't.","sc":"由于训练形成的反应模式，进行曲会不会激起你的爱国情感，宗教象征会不会唤起你的崇敬之情，你会不会更恭敬地听从一位名字后面带有“医学博士”头衔的人的健康建议，而不是听从没有这种头衔的人。","a":["崇敬","敬畏"]},{"w":"consensus","m":"共识；一致意见","p":"/ˈkɒnsənsəs/","s":"Despite such efforts, the literature shows little consensus regarding the causes or manifestations of human bias.","sc":"尽管做出了这些努力，相关文献在有关人类偏见的原因或表现方面几乎没有形成共识。","a":["共识","一致意见"]},{"w":"prudence","m":"谨慎；审慎","p":"/ˈpruːdəns/","s":"Prudence is the better part of valor.","sc":"谨慎是勇敢中更明智的一面。","a":["谨慎","审慎"]},{"w":"exhaustive","m":"详尽全面的","p":"/ɪɡˈzɔːstɪv/","s":"America’s Geological Survey prepared an exhaustive study of oil depletion last year that put the peak of production some decades off.","sc":"美国地质调查局去年做了一项详尽的石油枯竭研究，认为产量高峰还要推迟几十年。","a":["详尽全面的"]},{"w":"denounce","m":"公开谴责","p":"/dɪˈnaʊns/","s":"Many characters denounce corruption in the novel.","sc":"小说中的许多人物公开谴责腐败。","a":["公开谴责"]},{"w":"substitute","m":"替代；替代品","p":"/ˈsʌbstɪtjuːt/","s":"One might think that desert sand would be a ready substitute, but its grains are finer and smoother; they don't adhere to rougher sand grains, and tend to blow away.","sc":"人们可能会以为沙漠沙子会是一种现成的替代品，但它的颗粒更细更滑；它���不会黏附在更粗糙的沙粒上，而且容易被风吹走。","a":["替代","替代品"]},{"w":"superficial","m":"表面的；肤浅的","p":"/ˌsuːpəˈfɪʃəl/","s":"The attractions of video games, however, are superficial and short-lived.","sc":"然而，电子游戏的吸引力只是表面的，而且短暂。","a":["表面的","肤浅的"]},{"w":"protract","m":"延长；拖延","p":"/prəˈtrækt/","s":"The council hoped to protract the discussion until morning.","sc":"委员会希望把讨论拖到早上。","a":["延长","拖延"]},{"w":"anticipate","m":"预期；预先想到","p":"/ænˈtɪs.ɪ.peɪt/","s":"Many firms that failed to anticipate the consequences of this evolving body of research have been bankrupted by the results.","sc":"许多未能预见这一不断发展的研究体系所带来后果的公司，最终都因此破产了。","a":["预期","预先想到"]},{"w":"contentious","m":"有争议的；好争辩的","p":"/kənˈtenʃəs/","s":"Although the issue is highly contentious, some researchers argue that many of these microbes belong to a distinct and previously unrecognized branch of life.","sc":"尽管这个问题极具争议，但一些研究人员认为，其中许多微生物属于一个独特且此前未被识别的生命分支。","a":["有争议的","好争辩的"]},{"w":"supplement","m":"补充；增补","p":"/ˈsʌplɪment/","s":"Each group took a dietary supplement.","sc":"每组都服用了一种膳食补充剂。","a":["补充","增补"]},{"w":"elide","m":"省略；回避处理","p":"/ɪˈlaɪd/","s":"The editor chose to elide the repetitive paragraph.","sc":"编辑选择省去那段重复的文字。","a":["省略","回避处理"]},{"w":"expound","m":"详细阐述","p":"/ɪkˈspaʊnd/","s":"Yet, while experts continue to expound a powerful argument for the importance of play in children’s lives, the actual time children spend playing continues to decrease.","sc":"然而，尽管专家们Continue详细阐述玩耍对儿童生活重要性的有力论据，儿童实际用于玩耍的时间却继续减少。","a":["详细阐述"]},{"w":"deliberation","m":"慎重考虑；商议","p":"/ˌdel.ɪ.bəˈreɪ.ʃən/","s":"One foreign affair decision made by a well-known US political leader in the 1960s is typically held us as an example of the perils of inadequate thought, whereas his successful handling of a water crisis is cited as an example of the advantages of careful deliberation.","sc":"一位美国知名政治领袖在二十世纪六十年代作出的一项外交决策，通常被视为思考不足风险的例子；而他对一场水危机的成功处理，则被视为审慎权衡的优势的例子。","a":["慎重考虑","商议"]},{"w":"collaborator","m":"合作者；协作者","p":"/kəˈlæbəreɪtə/","s":"Some of these early alterations were likely made by the theater company to adapt a play to a particular occasion, others by a collaborator, others for the government censors, still others by the printer, but many of the most significant changes seem to bear the mark of Shakespeare himself.","sc":"其中一些早期改动很可能是剧团为了适应特定场合而做的，另一些则出自一位合作者，还有一些是为了政府审查官，另外一些是印刷商所为，但许多最重要的改动似乎都带有莎士比亚本人的印记。","a":["合作者","协作者"]},{"w":"reprieve","m":"暂缓；暂时解脱","p":"/rɪˈpriːv/","s":"There was a lucky reprieve for the State Bed too.","sc":"州床也幸运地获得了缓期处理。","a":["暂缓","暂时解脱"]},{"w":"designate","m":"指定；标明","p":"/ˈdezɪɡneɪt/","s":"The word 'cobot', from 'collaborative robot', has been invented to designate this type of robot.","sc":"“cobot”这个词来自“协作机器人”，是用来指称这种机器人类型的。","a":["指定","标明"]},{"w":"prolong","m":"延长；拖延","p":"/prəˈlɒŋ/","s":"The doctor said he could prolong his life with treatment.","sc":"医生说他可以通过治疗延长生命。","a":["延长","拖延"]},{"w":"summation","m":"总结；概括","p":"/ˌsʌmˈeɪʃən/","s":"The summation of the case was clear by the end of the trial.","sc":"到审判结束时，这个案件的总结已经很清楚了。","a":["总结","概括"]},{"w":"assuage","m":"缓解；减轻","p":"/əˈsweɪdʒ/","s":"She said nothing could assuage her guilt.","sc":"她说没有什么能减轻她的内疚。","a":["缓解","减轻"]},{"w":"feasible","m":"可行的；能够实现的","p":"/ˈfiːzəbl/","s":"However, unless the usage of the bridge was to be greatly restricted, only two generic options to improve its performance were considered feasible.","sc":"然而，除非大幅限制这座桥的使用，否则只有两个通用方案被认为可行，以改善其性能。","a":["可行的","能够实现的"]},{"w":"imitator","m":"模仿者；仿制者","p":"/ˈɪmɪteɪtə/","s":"The imitator copied the singer's style.","sc":"这个模仿者模仿了那位歌手的风格。","a":["模仿者","仿制者"]},{"w":"esteem","m":"尊敬；高度评价","p":"/ɪˈstiːm/","s":"One may well wonder, therefore, why some minerals are held in so much higher esteem than others.","sc":"因此，人们不禁要问，为什么有些矿物比另一些矿物受到高得多的敬重。","a":["尊敬","高度评价"]},{"w":"illuminate","m":"阐明；照亮","p":"/ɪˈluːmɪneɪt/","s":"Floodlights in the cave's main chamber illuminate the ceiling, vaulted like a cathedral above 5,000 square feet of floor space.","sc":"洞穴主厅里的泛光灯照亮了天花板，那天花板拱起如同大教堂，覆盖着五千平方英尺的地面空间。","a":["阐明","照亮"]},{"w":"extend","m":"延伸；扩大；延长","p":"/ɪkˈstend/","s":"I am an American writer, in the American mainstream, trying to extend it.","sc":"我是美国主流中的一名美国作家，试图扩展它。","a":["延伸","扩大","延长"]},{"w":"coincidence","m":"巧合","p":"/ˌkəʊˈɪnsɪdəns/","s":"It is no coincidence that these are the areas where languages are disappearing the fastest.","sc":"这些地区的语言消失得最快，这绝非巧合。","a":["巧合"]},{"w":"vigilance","m":"警觉；警惕","p":"/ˈvɪdʒɪləns/","s":"The balance between rest and vigilance is crucial for survival, revealing the intricate adaptations across the animal kingdom.","sc":"休息与警觉之间的平衡对生存至关重要，揭示了整个动物王国中错综复杂的适应机制。","a":["警觉","警惕"]},{"w":"incident","m":"事件；事变","p":"/ˈɪnsɪdənt/","s":"In 1956, after their home was bombed, supporters were told how much his wife's strength had helped him through that incident.","sc":"一九五六年，他们的家被炸毁后，支持者们被告知他妻子的坚强在那起事件中给了他多大帮助。","a":["事件","事变"]},{"w":"overlook","m":"忽视；未注意到","p":"/ˌəʊvəˈlʊk/","s":"For instance, the assumption that technological immersion leads to skepticism may overlook other factors, such as economic precarity or political polarization, which also influence trust.","sc":"例如，认为技术沉浸会导致怀疑的假设可能会忽略其他因素，比如经济不稳定或政治极化，而这些因素也会影响信任。","a":["忽视","未注意到"]},{"w":"amass in","m":"在……聚集；积累","p":"/əˈmæs ɪn/","s":"The dust will amass in the corner if the window stays open.","sc":"如果窗户一直开着，灰尘就会在角落里堆积起来。","a":["在……聚集","积累"]},{"w":"exemplification","m":"例证；典型体现","p":"/ˌeksɪmplɪfɪˈkeɪʃən/","s":"The exemplification of the rule was clear in her careful explanation.","sc":"这条规则的例证在她细致的解释中很清楚。","a":["例证","典型体现"]},{"w":"detractor","m":"批评者；贬低者","p":"/dɪˈtræktə/","s":"Even his detractor admitted that he was a skilled negotiator.","sc":"甚至连他的批评者都承认他是个熟练的谈判者。","a":["批评者","贬低者"]},{"w":"precursor","m":"先驱；前兆","p":"/ˈpriːkɜːsə/","s":"Within a millennium, however, Chinese chariot-makers had developed a vehicle with shafts, the precursor of the true carriage or cart.","sc":"然而，经过一千年，中国的战车制造者已经发展出一种带车辕的车辆，它是后来真正马车或货车的前身。","a":["先驱","前兆"]},{"w":"satisfy","m":"满足；使满意","p":"/ˈsætɪfaɪ/","s":"However, the abundance of this resource in Australia could satisfy the entire country's needs for thousands of years at the current rate of consumption.","sc":"然而，在当前消费速度下，澳大利亚这种资源的丰富程度足以满足全国数千年的需求。","a":["满足","使满意"]},{"w":"brood on","m":"反复忧思；沉思","p":"/bruːd ɒn/","s":"He would brood on the past for hours.","sc":"他会几个小时地对过去的事反复思虑。","a":["反复忧思","沉思"]},{"w":"omit","m":"省略；遗漏","p":"/ˈɒmɪt/","s":"You can omit the salt if you prefer.","sc":"如果你愿意，可以省略盐。","a":["省略","遗漏"]},{"w":"permissible","m":"允许的；可接受的","p":"/pəˈmɪsɪbəl/","s":"Synthetic fingernails are also highly flammable and therefore not permissible.","sc":"人造指甲也极易燃，因此不被允许。","a":["允许的","可接受的"]},{"w":"prevail over","m":"战胜；压倒","p":"/prɪˈveɪl ˈəʊvə/","s":"The desire to prevail over fear pushed her forward.","sc":"战胜恐惧的愿望推动着她继续前进。","a":["战胜","压倒"]},{"w":"indulgently","m":"宽容地；纵容地","p":"/ɪnˈdʌldʒəntli/","s":"She smiled indulgently at the child.","sc":"她纵容地朝那个孩子微笑。","a":["宽容地","纵容地"]},{"w":"lighthearted about","m":"对……轻松随意的","p":"/ˌlaɪtˈhɑːtɪd əˈbaʊt/","s":"She remained lighthearted about the move.","sc":"她对这次搬家始终保持轻松愉快的态度。","a":["对……轻松随意的"]},{"w":"thoughtfulness","m":"体贴；深思熟虑","p":"/ˈθɔːtfʊlnəs/","s":"And he did so with great care, although at a slower tempo than was called for and with a formality that lent the Tin Pan Alley tune a depth and thoughtfulness no one else would have accorded it.","sc":"而且他确实做到了，虽然速度比要求的更慢，而且带着一种拘谨，使这首百老汇流行曲获得了无人会赋予它的深度与周到。","a":["体贴","深思熟虑"]},{"w":"counterfactual","m":"与事实相反的；假设性的","p":"/ˌkaʊntəˈfæktʃuəl/","s":"Such thinking about situations that do not exist involves what is termed counterfactual reasoning.","sc":"这种对不存在情境的思考涉及所谓的反事实推理。","a":["与事实相反的","假设性的"]},{"w":"modest about","m":"对……谦逊的","p":"/ˈmɒdɪst əˈbaʊt/","s":"She is modest about her success.","sc":"她对自己的成功很谦逊。","a":["对……谦逊的"]},{"w":"originality","m":"原创性；独创性","p":"/ˌɒrɪdʒɪˈnæləti/","s":"To grasp the originality of this idea, it's necessary to realize two things about how music has traditionally been understood.","sc":"要理解这个想法的新颖性，有必要认识到关于音乐一直以来是如 function getAllWords() { return WORD_DATA.map((_,i)=>i); }

function getWordState(idx) {
  if (!G.wordStates[idx]) G.wordStates[idx] = {status:'unseen',correct:0,wrongStreak:0,seen:0};
  return G.wordStates[idx];
}

function isWordMastered(idx) { return G.permanentMastered.includes(idx) || G.mastered.includes(idx); }

function getAvailableWords() {
  return getAllWords().filter(i => !isWordMastered(i) && getWordState(i).status !== 'mastered');
}

// ============ MAP GENERATION ============
function generateFloor(floorIdx) {
  const nodes = [];
  // Position 1: Battle
  nodes.push({type:'battle',branchLeft:false,branchRight:false,visited:false,cleared:false,wordIndices:[],x:1});
  // Positions 2-19: Random with branches
  for (let pos = 2; pos <= 19; pos++) {
    const isBranch = BRANCH_POSITIONS.includes(pos);
    const type = isBranch ? randomWeighted(['battle','event','shop','rest','spring','trap'],[40,20,15,15,7,3]) :
                 randomWeighted(['battle','event','shop','rest','spring','trap'],[40,20,15,15,7,3]);
    nodes.push({type, branchLeft:isBranch, branchRight:isBranch, visited:false, cleared:false, wordIndices:[], x:pos});
  }
  // Position 20: Boss
  nodes.push({type:'boss',branchLeft:false,branchRight:false,visited:false,cleared:false,wordIndices:[],x:20});
  return nodes;
}

function randomWeighted(items, weights) {
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length-1];
}

// Word distribution algorithm
function distributeWords() {
  const remainingFloors = TOTAL_FLOORS - G.floor;
  const unseen = getAllWords().filter(i => getWordState(i).status === 'unseen' && !isWordMastered(i));
  const toAllocate = Math.min(20, Math.max(10, Math.ceil(unseen.length / remainingFloors)));
  const battleNodes = G.map.filter(n => n.type === 'battle');
  // Shuffle and distribute
  const shuffled = [...unseen].sort(()=>Math.random()-0.5);
  const newWords = shuffled.slice(0, Math.min(toAllocate, shuffled.length));
  // Assign words to battle nodes
  let wi = 0;
  for (const node of battleNodes) {
    const slots = Math.min(5, Math.max(2, Math.ceil((newWords.length - wi) / (battleNodes.length - battleNodes.indexOf(node)))));
    const assigned = newWords.slice(wi, wi + slots);
    node.wordIndices = assigned.map(w => w);
    assigned.forEach(w => {
      const st = getWordState(w);
      st.status = 'learning';
      st.seen = 0;
    });
    wi += slots;
    if (wi >= newWords.length) break;
  }
  // Fill remaining battle nodes with review/learning words
  if (wi < newWords.length) {
    // still distribute remaining new words
    const remaining = newWords.slice(wi);
    for (const node of battleNodes) {
      if (node.wordIndices.length < 2 && remaining.length > 0) {
        const extra = remaining.splice(0, 1);
        node.wordIndices.push(...extra);
        extra.forEach(w => { getWordState(w).status = 'learning'; });
      }
    }
  }
  // If no new words, fill with learning/reviewing
  for (const node of battleNodes) {
    if (node.wordIndices.length === 0) {
      const pool = getAllWords().filter(i => {
        const st = getWordState(i);
        return (st.status === 'learning' || st.status === 'reviewing') && !isWordMastered(i);
      });
      if (pool.length > 0) {
        const cnt = Math.min(4, pool.length);
        const selected = [];
        for (let j = 0; j < cnt; j++) {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          if (!selected.includes(pick)) selected.push(pick);
        }
        node.wordIndices = selected;
      }
    }
  }
}

// ============ GAME FLOW ============
function startGame() {
  // Reset state
  G = {
    floor: 0, node: 0,
    hp: 10, maxHp: 10, shield: 1, shieldBroken: false,
    spirit: 3, maxSpirit: 5, gold: 0,
    wordStates: {}, mastered: [],
    permanentMastered: loadMastered(),
    map: [], currentNodeMonsters: [], currentTargetIdx: 0,
    inventory: [], scrollActive: false, lensActive: false,
    eventReviewMode: false, bossFight: false,
    bossHp: 0, bossMaxHp: 0, bossWords: [],
    gameOver: false, startTime: Date.now(), totalWrong: 0,
  };
  // Remove permanently mastered from pool
  G.permanentMastered.forEach(i => {
    if (!G.wordStates[i]) G.wordStates[i] = {status:'mastered',correct:0,wrongStreak:0,seen:0};
    else G.wordStates[i].status = 'mastered';
  });
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  nextFloor();
}

function nextFloor() {
  if (G.floor >= TOTAL_FLOORS) { victory(); return; }
  G.shield = 1; G.shieldBroken = false;
  G.spirit = Math.min(G.maxSpirit, G.spirit + 1);
  G.node = 0;
  G.map = generateFloor(G.floor);
  distributeWords();
  logSystem(`═══ Floor ${G.floor+1} — The Abyss ═══`);
  logSystem(`Shield restored to ${G.shield} layer.`);
  updateDisplay();
  renderMap();
  enterNode(0);
}

function enterNode(idx) {
  G.node = idx;
  const node = G.map[idx];
  node.visited = true;
  G.currentNodeMonsters = [];
  G.currentTargetIdx = 0;
  G.bossFight = false;
  G.scrollActive = false;
  renderMap();
  updateDisplay();
  switch (node.type) {
    case 'battle': startBattle(node); break;
    case 'boss': startBoss(node); break;
    case 'event': startEvent(node); break;
    case 'shop': startShop(node); break;
    case 'rest': startRest(node); break;
    case 'spring': startSpring(node); break;
    case 'trap': startTrap(node); break;
    default: advanceNode(); break;
  }
  saveGame();
}

function advanceNode() {
  const node = G.map[G.node];
  node.cleared = true;
  if (G.node >= NODES_PER_FLOOR - 1) {
    logSystem('The Abyss Lord is defeated! A gate to the next floor opens...');
    G.floor++;
    if (G.floor >= TOTAL_FLOORS) { victory(); return; }
    setTimeout(() => nextFloor(), 1500);
    return;
  }
  // Check if next node is a branch
  const nextIdx = G.node + 1;
  const nextNode = G.map[nextIdx];
  if (nextNode.branchLeft) {
    showBranchChoice(nextIdx);
  } else {
    setTimeout(() => enterNode(nextIdx), 500);
  }
}

function showBranchChoice(nodeIdx) {
  const battleArea = document.getElementById('battle-scene');
  const choiceArea = document.getElementById('choice-area');
  battleArea.innerHTML = `
    <div class="room-label">⚡ Crossroads</div>
    <div class="scene-title">Choose Your Path</div>
    <div class="scene-desc">Both paths converge at the next junction. Total nodes unchanged.</div>`;
  choiceArea.innerHTML = `
    <button onclick="chooseBranch(${nodeIdx},'left')">⬅ Left — Through the Shadow Rift</button>
    <button onclick="chooseBranch(${nodeIdx},'right')">➡ Right — Via the Glimmer Corridor</button>`;
}

function chooseBranch(nodeIdx, direction) {
  document.getElementById('choice-area').innerHTML = '';
  logSystem(`Took the ${direction==='left'?'left':'right'} path...`);
  // Both branches lead to the same next node - just flavor
  setTimeout(() => enterNode(nodeIdx), 300);
}

// ============ BATTLE SYSTEM ============
function startBattle(node) {
  if (!node.wordIndices || node.wordIndices.length === 0) {
    logSystem('This room is empty...');
    setTimeout(() => advanceNode(), 800);
    return;
  }
  G.currentNodeMonsters = node.wordIndices.map((wi, i) => ({
    wordIndex: wi,
    hintLevel: 0,
    defeated: false,
    skipped: false,
    wrongCount: 0,
  }));
  G.currentTargetIdx = 0;
  G.bossFight = false;
  renderBattle();
  focusInput();
}

function renderBattle() {
  const area = document.getElementById('battle-scene');
  const node = G.map[G.node];
  const nodeTypeNames = {battle:'⚔️ Battle',boss:'💀 Boss',event:'❓ Event',shop:'🛒 Shop',rest:'🛌 Rest',spring:'💧 Spring',trap:'💀 Trap'};

  if (G.bossFight) {
    area.innerHTML = `
      <div class="room-label">💀 Abyss Lord — Floor ${G.floor+1}</div>
      <div class="scene-title" style="color:#ff4444;">Boss HP: ${'█'.repeat(Math.max(0,G.bossHp))}${'░'.repeat(Math.max(0,G.bossMaxHp-G.bossHp))} ${G.bossHp}/${G.bossMaxHp}</div>`;
    return;
  }

  if (G.currentNodeMonsters.length === 0) {
    area.innerHTML = `<div class="room-label">${nodeTypeNames[node.type] || ''}</div>
      <div class="scene-title">${node.type==='rest'?'A quiet sanctuary':node.type==='shop'?'Abyss Merchant stall':node.type==='event'?'Fork in fate':''}</div>`;
    return;
  }

  let html = `<div class="room-label">${nodeTypeNames[node.type]} · 房间 ${G.node+1}</div>
    <div style="color:var(--text-dim);margin-bottom:8px;">Progress: ${G.currentNodeMonsters.filter(m=>m.defeated||m.skipped).length} / ${G.currentNodeMonsters.length}</div>
    <div id="monster-list">`;

  G.currentNodeMonsters.forEach((mon, i) => {
    const word = WORD_DATA[mon.wordIndex];
    const st = getWordState(mon.wordIndex);
    const isActive = i === G.currentTargetIdx && !mon.defeated && !mon.skipped;
    const cls = mon.defeated || mon.skipped ? 'defeated' : (isActive ? 'active' : '');
    let hintHtml = '';
    if (isActive && !mon.skipped) {
      if (G.scrollActive) {
        hintHtml = `<span class="monster-hint" style="color:#f1c40f;">📜 Scroll reveals: ${word.m}</span>`;
      } else if (mon.hintLevel >= 1 && word.s) {
        hintHtml = `<span class="monster-hint" style="color:var(--text-dim);">💡 ${word.s}</span>`;
      } else if (st.status === 'learning' && word.s) {
        hintHtml = `<span class="monster-hint" style="color:var(--text-dim);">📖 ${word.s}</span>`;
      }
    }
    let hint2 = '';
    if (isActive && mon.hintLevel >= 2) {
      hint2 = `<span class="monster-hint" style="color:#f1c40f;">🔤 首字母：${getPinyinInitial(word.m)}</span>`;
    }
    if (isActive && mon.hintLevel >= 3) {
      hint2 = `<span class="monster-hint" style="color:#e74c3c;">❗ 答案：${word.m}</span>`;
    }
    const statusLabel = mon.defeated ? '✓' : (mon.skipped ? '⊘' : (isActive ? '◈' : '○'));
    html += `<div class="monster-row ${cls}">
      <span class="monster-status">${statusLabel}</span>
      <span class="monster-word">${word.w}</span>
      ${hintHtml} ${hint2}
      ${st.status==='reviewing'&&!mon.defeated&&!mon.skipped?'<span style="color:#8e44ad;font-size:0.75em;">复习</span>':''}
    </div>`;
  });
  html += '</div>';
  area.innerHTML = html;
}

function getPinyinInitial(text) {
  // Simple: return first char pinyin approximation or character itself
  // For Chinese text, return the first character
  if (!text) return '?';
  const c = text.trim()[0];
  return c;
}

function focusInput() {
  const inp = document.getElementById('cmd-input');
  if (inp) { inp.focus(); inp.value = ''; }
}

// Handle input submission
document.getElementById('cmd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') { e.preventDefault(); useScrollItem(); return; }
  if (e.key !== 'Enter') return;
  const input = this.value.trim();
  if (!input) return;
  this.value = '';
  dispatchInput(input);
});

// Central input dispatcher
function dispatchInput(input) {
  if (G.gameOver) return;
  if (input === '卷轴' || input === '使用卷轴') { useScrollItem(); return; }

  if (G._shopMode) { handleShopInput(input); return; }
  if (G._eventMode) { handleEventInput(input); return; }
  if (G.eventReviewMode) { handleReviewInput(input); return; }
  if (G.bossFight) { handleBossInput(input); return; }

  handleNormalBattle(input);
}

function handleNormalBattle(input) {
  if (G.currentNodeMonsters.length === 0) return;

  const target = G.currentNodeMonsters[G.currentTargetIdx];
  if (!target || target.defeated || target.skipped) return;

  const word = WORD_DATA[target.wordIndex];
  const isCorrect = checkAnswer(input, word.a);

  if (isCorrect) {
    handleCorrectAnswer(target);
  } else {
    handleWrongAnswer(target);
  }
  renderBattle();
  updateDisplay();
  focusInput();
  saveGame();
}

function useScrollItem() {
  if (G.bossFight) { logSystem('Scrolls are ineffective in Boss fights.'); return; }
  if (!G.inventory.includes('scroll')) { logSystem('You have no Memory Scrolls.'); return; }
  const target = G.currentNodeMonsters[G.currentTargetIdx];
  if (!target || target.defeated || target.skipped) { logSystem('No target word right now.'); return; }
  G.inventory = G.inventory.filter(i => i !== 'scroll');
  G.scrollActive = true;
  const word = WORD_DATA[target.wordIndex];
  logSystem(`📜 Used Memory Scroll! "${word.w}" → ${word.m}`, 'gold');
  updateDisplay();
  renderBattle();
  focusInput();
}

function checkAnswer(input, acceptableAnswers) {
  if (!acceptableAnswers || acceptableAnswers.length === 0) return false;
  const normalized = input.toLowerCase().replace(/\s+/g,'');
  return acceptableAnswers.some(a => {
    const an = a.toLowerCase().replace(/\s+/g,'');
    return normalized.includes(an) || an.includes(normalized);
  });
}

function handleCorrectAnswer(target) {
  const word = WORD_DATA[target.wordIndex];
  const st = getWordState(target.wordIndex);
  target.defeated = true;
  G.gold += 2;

  logLine(`✓ Correct! ${word.w} — ${word.m} <span class="gold">+2🪙</span>`, 'correct');
  spawnFloatText('+2 🪙', '#f1c40f');

  st.correct++;
  st.wrongStreak = 0;
  st.seen++;

  // State transitions
  if (st.status === 'learning' && st.correct >= 2) {
    st.status = 'reviewing';
    st.correct = 0;
    logLine(`📈 "${word.w}" promoted to [Reviewing]`, 'info');
  } else if (st.status === 'reviewing' && st.correct >= 2) {
    st.status = 'mastered';
    G.mastered.push(target.wordIndex);
    logLine(`🌟 "${word.w}" Mastered! Added to Codex.`, 'gold');
    spawnFloatText('精通！', '#c9a050');
  }

  // Advance to next monster
  advanceTarget();
}

function handleWrongAnswer(target) {
  const word = WORD_DATA[target.wordIndex];
  const st = getWordState(target.wordIndex);
  target.wrongCount++;
  G.totalWrong++;
  st.wrongStreak++;

  // State: reviewing consecutive wrongs -> back to learning
  if (st.status === 'reviewing' && st.wrongStreak >= 2) {
    st.status = 'learning';
    st.correct = Math.floor(st.correct / 2);
    st.wrongStreak = 0;
    logLine(`📉 "${word.w}" double wrong, demoted to [Learning]`, 'info');
  }

  if (target.wrongCount >= 3) {
    // Force skip
    target.skipped = true;
    target.defeated = true;
    logLine(`⊘ "${word.w}" revealed: ${word.m} (forced skip, no progress, no damage)`, 'system');
    advanceTarget();
    return;
  }

  // Damage
  if (G.shield > 0 && !G.shieldBroken) {
    G.shield = 0;
    G.shieldBroken = true;
    logLine(`🛡️ Shield shattered! Damage absorbed.`, 'wrong');
    spawnFloatText('护盾破碎！', '#3498db');
  } else {
    G.hp--;
    logLine(`💔 Wrong! ${word.w} — took 1 damage. HP: ${G.hp}`, 'wrong');
    spawnFloatText('-1 ❤️', '#e74c3c');
    document.getElementById('battle-area').classList.add('shake');
    setTimeout(() => document.getElementById('battle-area').classList.remove('shake'), 500);
  }

  // Progressive hints
  target.hintLevel = target.wrongCount;
  if (target.wrongCount === 1 && word.s) {
    logLine(`💡 Hint: ${word.s}`, 'info');
  } else if (target.wrongCount === 2) {
    logLine(`🔤 Hint: starts with "${getPinyinInitial(word.m)}"`, 'info');
  }

  if (G.hp <= 0) {
    gameOver_defeat();
    return;
  }

  renderBattle();
  updateDisplay();
}

function advanceTarget() {
  // Find next undefeated monster
  for (let i = G.currentTargetIdx + 1; i < G.currentNodeMonsters.length; i++) {
    if (!G.currentNodeMonsters[i].defeated && !G.currentNodeMonsters[i].skipped) {
      G.currentTargetIdx = i;
      renderBattle();
      return;
    }
  }
  // Check if all defeated
  const allDone = G.currentNodeMonsters.every(m => m.defeated || m.skipped);
  if (allDone) {
    G.gold += 1; // Clear bonus
    logLine(`⚔️ Room cleared! +1🪙 bonus`, 'gold');
    G.map[G.node].cleared = true;
    G.currentNodeMonsters = [];
    renderBattle();
    setTimeout(() => advanceNode(), 1000);
  }
}

// ============ BOSS SYSTEM ============
function startBoss(node) {
  G.bossFight = true;
  const reviewingWords = getAllWords().filter(i => getWordState(i).status === 'reviewing' && !isWordMastered(i));
  G.bossMaxHp = reviewingWords.length + 1;
  G.bossHp = G.bossMaxHp;
  G.bossWords = reviewingWords.length > 0 ? [...reviewingWords].sort(()=>Math.random()-0.5) :
    getAllWords().filter(i => getWordState(i).status === 'learning' && !isWordMastered(i)).slice(0, 3);
  if (G.bossWords.length === 0) G.bossWords = getAllWords().filter(i => !isWordMastered(i)).slice(0, 3);
  G.currentNodeMonsters = G.bossWords.map((wi, i) => ({
    wordIndex: wi, hintLevel: 0, defeated: false, skipped: false, wrongCount: 0, isBossWord: true,
  }));
  G.currentTargetIdx = 0;
  logSystem(`💀 The Abyss Lord appears! Defeat ${G.bossWords.length} review words...`);
  renderBattle();
  renderBossBattle();
  focusInput();
}

function renderBossBattle() {
  // Reuse renderBattle, but also show boss words
  let html = document.getElementById('battle-scene').innerHTML;
  html += '<div style="margin-top:10px;">';
  G.currentNodeMonsters.forEach((mon, i) => {
    const word = WORD_DATA[mon.wordIndex];
    const isActive = i === G.currentTargetIdx && !mon.defeated && !mon.skipped;
    html += `<div class="monster-row ${mon.defeated?'defeated':(isActive?'active':'')}" style="font-size:0.85em;">
      <span>${mon.defeated?'✓':(isActive?'◈':'○')}</span>
      <span class="monster-word" style="font-size:1em;">${word.w}</span>
    </div>`;
  });
  html += '</div>';
  document.getElementById('battle-scene').innerHTML = html;
}

function handleBossInput(input) {
  const target = G.currentNodeMonsters[G.currentTargetIdx];
  if (!target || target.defeated || target.skipped) { advanceBossTarget(); return; }

  const word = WORD_DATA[target.wordIndex];
  const isCorrect = checkAnswer(input, word.a);

  if (isCorrect) {
    target.defeated = true;
    G.bossHp--;
    G.gold += 2;
    logLine(`✓ Hit! Boss HP: ${G.bossHp}/${G.bossMaxHp}`, 'correct');
    spawnFloatText('暴击！', '#ff4444');
    advanceBossTarget();
    if (G.bossHp <= 0) {
      bossDefeated();
      return;
    }
  } else {
    G.bossHp = Math.min(G.bossMaxHp, G.bossHp + 1);
    logLine(`✗ The Lord recovers 1 HP! Boss HP: ${G.bossHp}/${G.bossMaxHp}`, 'wrong');
    document.getElementById('battle-area').classList.add('shake');
    setTimeout(() => document.getElementById('battle-area').classList.remove('shake'), 500);
    if (G.shield > 0 && !G.shieldBroken) {
      G.shield = 0; G.shieldBroken = true;
    } else {
      G.hp--;
    }
    if (G.hp <= 0) { gameOver_defeat(); return; }
  }
  renderBattle();
  updateDisplay();
  focusInput();
  saveGame();
}

function advanceBossTarget() {
  for (let i = G.currentTargetIdx + 1; i < G.currentNodeMonsters.length; i++) {
    if (!G.currentNodeMonsters[i].defeated && !G.currentNodeMonsters[i].skipped) {
      G.currentTargetIdx = i;
      renderBattle();
      return;
    }
  }
  if (G.bossHp > 0) {
    G.currentNodeMonsters.forEach(m => { m.defeated = false; m.skipped = false; });
    G.currentTargetIdx = 0;
    renderBattle();
  }
}

function bossDefeated() {
  const reward = (G.floor + 1) * 5;
  G.gold += reward;
  logSystem(`💀 Abyss Lord defeated! +${reward}🪙`);
  G.bossFight = false;
  G.currentNodeMonsters = [];
  G.map[G.node].cleared = true;
  renderBattle();
  updateDisplay();
  saveGame();
  setTimeout(() => advanceNode(), 1500);
}

// ============ EVENT SYSTEM ============
function startEvent(node) {
  G._eventMode = true;
  const evt = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  G._currentEvent = evt;
  const area = document.getElementById('battle-scene');
  area.innerHTML = `<div class="room-label">❓ Event</div>
    <div class="scene-title">${evt.name}</div>
    <div class="scene-desc">${evt.desc}</div>`;
  const choiceArea = document.getElementById('choice-area');
  choiceArea.innerHTML = `
    <button onclick="eventChoice('A')">🅰 ${evt.optA}</button>
    <button onclick="eventChoice('B')">🅱 ${evt.optB}</button>`;
}

function handleEventInput(input) {
  logSystem('Click the option buttons above to choose.');
  focusInput();
}

function eventChoice(opt) {
  const evt = G._currentEvent;
  document.getElementById('choice-area').innerHTML = '';
  G._eventMode = false;

  switch (evt.name) {
    case '遗忘迷雾':
      if (opt === 'A') {
        const mastered = [...G.mastered];
        if (mastered.length > 0) {
          const idx = mastered[Math.floor(Math.random() * mastered.length)];
          G.mastered = G.mastered.filter(m => m !== idx);
          getWordState(idx).status = 'reviewing';
          getWordState(idx).correct = 0;
          G.gold += 5;
          logSystem(`"${WORD_DATA[idx].w}" demoted to Reviewing. +5🪙`);
        } else { logSystem('No mastered words to forget.'); }
      } else {
        if (G.gold >= 2) { G.gold -= 2; logSystem('Paid 2 gold, the mist dissipates.'); }
        else { logSystem('Not enough gold... the mist fades.'); }
      }
      break;
    case '智慧石碑':
      if (opt === 'A') {
        G.inventory.push('scroll');
        logSystem('Gained 1 Memory Scroll!');
      } else {
        if (G.spirit >= 1) {
          G.spirit--;
          const learning = getAllWords().filter(i => getWordState(i).status === 'learning' && !isWordMastered(i));
          if (learning.length > 0) {
            const w = learning[Math.floor(Math.random() * learning.length)];
            getWordState(w).status = 'reviewing';
            getWordState(w).correct = 0;
            logSystem(`"${WORD_DATA[w].w}" promoted to [Reviewing]! Used 1 Spirit.`);
          }
        } else { logSystem('Not enough Spirit!'); }
      }
      break;
    case '诅咒之书':
      if (opt === 'A') {
        G.maxHp += 2;
        if (G.spirit >= 1) G.spirit--;
        logSystem('Max HP +2, lost 1 Spirit.');
      } else {
        if (G.gold >= 2) { G.gold -= 2; logSystem('Lost 2 gold, evaded the curse.'); }
        else { logSystem('Not enough gold... the curse fizzles.'); }
      }
      break;
    case '记忆回响':
      if (opt === 'A') {
        startEventReview();
        return;
      } else {
        G.shieldBroken = true;
        G.shield = 0;
        logSystem('Floor shield shattered!');
      }
      break;
    case '幸运宝箱':
      if (opt === 'A') {
        G.gold += 3;
        logSystem('Gained 3 🪙!');
      } else {
        if (Math.random() < 0.5) {
          G.gold += 8;
          logSystem('Lucky! Gained 8 🪙!', 'gold');
        } else {
          if (G.inventory.length > 0) {
            const lost = G.inventory.pop();
            logSystem(`Unlucky... lost ${lost==='scroll'?'Memory Scroll':lost==='potion'?'Review Potion':'an item'}.`, 'wrong');
          } else {
            logSystem('Inventory empty, nothing to lose.');
          }
        }
      }
      break;
  }
  G.map[G.node].cleared = true;
  updateDisplay();
  saveGame();
  setTimeout(() => advanceNode(), 1000);
}

function startEventReview() {
  G.eventReviewMode = true;
  const pool = getAllWords().filter(i => getWordState(i).status === 'learning' && !isWordMastered(i));
  const selected = pool.slice(0, Math.min(3, pool.length));
  if (selected.length === 0) {
    logSystem('No learning words to review.');
    G.eventReviewMode = false;
    setTimeout(() => advanceNode(), 800);
    return;
  }
  G.currentNodeMonsters = selected.map(wi => ({
    wordIndex: wi, hintLevel: 0, defeated: false, skipped: false, wrongCount: 0,
  }));
  G.currentTargetIdx = 0;
  logSystem('Memory Echo: no HP penalty for errors!');
  renderBattle();
  focusInput();
}

function handleReviewInput(input) {
  const target = G.currentNodeMonsters[G.currentTargetIdx];
  if (!target || target.defeated || target.skipped) { advanceReviewTarget(); return; }
  const word = WORD_DATA[target.wordIndex];
  if (checkAnswer(input, word.a)) {
    target.defeated = true;
    const st = getWordState(target.wordIndex);
    st.correct++;
    if (st.status === 'learning' && st.correct >= 2) { st.status = 'reviewing'; st.correct = 0; }
    logLine(`✓ ${word.w} — Correct!`, 'correct');
  } else {
    logLine(`✗ ${word.w} — Wrong (no penalty)`, 'system');
    target.skipped = true;
  }
  advanceReviewTarget();
  renderBattle();
  focusInput();
}

function advanceReviewTarget() {
  for (let i = G.currentTargetIdx + 1; i < G.currentNodeMonsters.length; i++) {
    if (!G.currentNodeMonsters[i].defeated && !G.currentNodeMonsters[i].skipped) {
      G.currentTargetIdx = i;
      return;
    }
  }
  G.eventReviewMode = false;
  G.currentNodeMonsters = [];
  logSystem('Memory Echo ended.');
  setTimeout(() => advanceNode(), 800);
}

// ============ SHOP SYSTEM ============
const SHOP_ITEMS = [
  {id:'scroll',name:'Memory Scroll',price:3,desc:'Reveal the answer for the next word (not in Boss fights)'},
  {id:'review_potion',name:'Review Potion',price:2,desc:'Quiz 3 "reviewing" words (no HP penalty, progress counts)'},
  {id:'health_potion',name:'Health Potion',price:4,desc:'Restore 2 HP'},
  {id:'forget_charm',name:'Oblivion Charm',price:5,desc:'Demote 1 "mastered" word back to "reviewing", refund 2 gold'},
  {id:'root_lens',name:'Etymology Lens',price:8,desc:'Permanent (this run): show root/stem breakdowns in learning stage'},
  {id:'shield_rune',name:'Shield Rune',price:6,desc:'Instantly restore your broken floor shield'},
];

function startShop(node) {
  G._shopMode = true;
  const area = document.getElementById('battle-scene');
  area.innerHTML = `<div class="room-label">🛒 Abyss Merchant</div>
    <div class="scene-title">Purchase Items</div>`;
  let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;">';
  SHOP_ITEMS.forEach((item, i) => {
    const canBuy = G.gold >= item.price;
    html += `<div style="background:rgba(20,15,25,0.9);border:1px solid var(--border);padding:10px;border-radius:4px;width:180px;text-align:center;">
      <div style="color:var(--gold);font-weight:bold;">${item.name}</div>
      <div style="font-size:0.75em;color:var(--text-dim);margin:4px 0;">${item.desc}</div>
      <div style="color:${canBuy?'#f1c40f':'#999'};">🪙 ${item.price}</div>
      <button onclick="buyItem('${item.id}',${item.price})" ${!canBuy?'disabled':''}
        style="margin-top:4px;padding:4px 12px;background:${canBuy?'rgba(201,160,80,0.2)':'transparent'};color:${canBuy?'var(--gold)':'var(--text-dim)'};border:1px solid ${canBuy?'var(--gold-dim)':'var(--border)'};border-radius:4px;cursor:${canBuy?'pointer':'default'};">
        购买 [${i+1}]
      </button>
    </div>`;
  });
  html += '</div>';
  html += '<div style="margin-top:10px;color:var(--text-dim);">Type 1-6 to buy, or type "leave" to continue</div>';
  area.innerHTML += html;
  document.getElementById('choice-area').innerHTML = '';
}

function buyItem(id, price) {
  if (G.gold < price) { logSystem('Not enough gold!'); return; }
  G.gold -= price;
  switch (id) {
    case 'scroll': G.inventory.push('scroll'); logSystem('Gained Memory Scroll!'); break;
    case 'review_potion': startReviewPotion(); break;
    case 'health_potion': G.hp = Math.min(G.maxHp, G.hp + 2); logSystem('Restored 2 HP!'); break;
    case 'forget_charm':
      if (G.mastered.length > 0) {
        const idx = G.mastered.pop();
        getWordState(idx).status = 'reviewing'; getWordState(idx).correct = 0;
        G.gold += 2;
        logSystem(`"${WORD_DATA[idx].w}" demoted to Reviewing. Refund 2🪙.`);
      } else { G.gold += price; logSystem('No mastered words, refunded.'); }
      break;
    case 'root_lens': G.lensActive = true; logSystem('Etymology Lens equipped (this run only)!'); break;
    case 'shield_rune':
      if (G.shieldBroken) { G.shield = 1; G.shieldBroken = false; logSystem('Shield restored!'); }
      else { G.gold += price; logSystem('Shield intact, refunded.'); }
      break;
  }
  updateDisplay();
}

function startReviewPotion() {
  const pool = getAllWords().filter(i => getWordState(i).status === 'reviewing' && !isWordMastered(i));
  const selected = pool.slice(0, Math.min(3, pool.length));
  if (selected.length === 0) { logSystem('No reviewing words available.'); return; }
  G.currentNodeMonsters = selected.map(wi => ({
    wordIndex: wi, hintLevel: 0, defeated: false, skipped: false, wrongCount: 0,
  }));
  G.currentTargetIdx = 0;
  G.eventReviewMode = true;
  G._shopMode = false;
  logSystem('Review Potion active: no HP penalty!');
  renderBattle();
  focusInput();
}

function handleShopInput(input) {
  const cmd = input.toLowerCase();
  if (cmd === '离开' || cmd === 'leave' || cmd === 'exit' || cmd === 'q') {
    G._shopMode = false;
    document.getElementById('battle-scene').innerHTML = '';
    G.map[G.node].cleared = true;
    setTimeout(() => advanceNode(), 500);
    return;
  }
  const num = parseInt(cmd);
  if (num >= 1 && num <= 6) {
    const item = SHOP_ITEMS[num-1];
    buyItem(item.id, item.price);
    if (!G.eventReviewMode) startShop(G.map[G.node]); // refresh
    return;
  }
  logSystem('Type 1-6 to buy, or "leave" to exit.');
}

// ============ REST / SPRING / TRAP ============
function startRest(node) {
  G.hp = Math.min(G.maxHp, G.hp + 1);
  logSystem('🛌 Rested... restored 1 HP.');
  document.getElementById('battle-scene').innerHTML = `<div class="room-label">🛌 休息</div><div class="scene-title">Quiet Sanctuary</div><div class="scene-desc">HP +1</div>`;
  G.map[G.node].cleared = true;
  updateDisplay();
  setTimeout(() => advanceNode(), 1000);
}

function startSpring(node) {
  const learning = getAllWords().filter(i => getWordState(i).status === 'learning' && !isWordMastered(i));
  if (learning.length > 0) {
    const w = learning[Math.floor(Math.random() * learning.length)];
    getWordState(w).correct = Math.min(getWordState(w).correct + 1, 4);
    logSystem(`💧 Memory Spring: "${WORD_DATA[w].w}" learning progress +1.`);
  }
  document.getElementById('battle-scene').innerHTML = `<div class="room-label">💧 记忆泉</div><div class="scene-title">Memory waters surge...</div><div class="scene-desc">Random learning word progress +1</div>`;
  G.map[G.node].cleared = true;
  updateDisplay();
  setTimeout(() => advanceNode(), 1000);
}

function startTrap(node) {
  document.getElementById('battle-scene').innerHTML = `<div class="room-label">💀 陷阱</div><div class="scene-title">Trap triggered!</div><div class="scene-desc">Lose 1 HP</div>`;
  if (G.shield > 0 && !G.shieldBroken) {
    G.shield = 0; G.shieldBroken = true;
    logSystem('💀 Trap! Shield absorbed the damage.');
  } else {
    G.hp--;
    logSystem('💀 Trap! Took 1 damage.');
  }
  G.map[G.node].cleared = true;
  updateDisplay();
  if (G.hp <= 0) { gameOver_defeat(); return; }
  setTimeout(() => advanceNode(), 1000);
}

// ============ UI UPDATE ============
function updateDisplay() {
  document.getElementById('floor-label').textContent = `Floor ${G.floor+1}`;
  document.getElementById('room-progress').textContent = `${G.node+1} / ${NODES_PER_FLOOR}`;
  document.getElementById('hp-val').textContent = G.hp;
  document.getElementById('shield-val').textContent = G.shieldBroken ? '破碎' : G.shield;
  document.getElementById('spirit-val').textContent = G.spirit;
  document.getElementById('gold-val').textContent = G.gold;
  const totalMastered = G.permanentMastered.length + G.mastered.length;
  document.getElementById('mastered-val').textContent = `${totalMastered}/100`;
  const invMap = {scroll:'📜',review_potion:'🧪',health_potion:'❤️',forget_charm:'💫',root_lens:'🔍',shield_rune:'🛡️'};
  const invDisplay = G.inventory.length > 0 ? G.inventory.map(i=>invMap[i]||i).join(' ') : '空';
  document.getElementById('inventory-display').textContent = (invDisplay === 'Empty' ? 'Empty' : invDisplay) + (G.lensActive ? ' 🔍' : '');
}

function renderMap() {
  const container = document.getElementById('map-nodes');
  let html = '';
  for (let i = 0; i < G.map.length; i++) {
    const node = G.map[i];
    const typeClass = node.type;
    let cls = `map-node ${typeClass}`;
    if (i === G.node) cls += ' current';
    if (node.visited) cls += ' visited';
    if (node.branchLeft) cls += ' branch';
    const icons = {battle:'⚔',event:'?',shop:'$',rest:'♨',spring:'💧',trap:'☠',boss:'👹'};
    const label = node.type === 'boss' ? 'BOSS' : icons[node.type] || '?';
    html += `<div class="${cls}" onclick="onMapNodeClick(${i})" title="房间${i+1}: ${node.type}">${label}</div>`;
    if (i < G.map.length - 1) {
      const pathCls = (i === G.node || i === G.node - 1) ? 'map-path active' : 'map-path';
      html += `<div class="${pathCls}"></div>`;
    }
  }
  container.innerHTML = html;
  // Scroll to current node
  const currentEl = container.querySelector('.current');
  if (currentEl) currentEl.scrollIntoView({behavior:'smooth',inline:'center'});
}

function onMapNodeClick(idx) {
  // Only allow clicking visited nodes or current to replay
  if (idx === G.node) return; // already here
  // Can't skip ahead
}

// ============ LOGGING ============
function logSystem(msg) { logLine(msg, 'system'); }
function logLine(msg, cls) {
  const logArea = document.getElementById('log-area');
  const div = document.createElement('div');
  div.className = `log-line ${cls || 'system'}`;
  div.innerHTML = msg;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
  // Keep max 200 lines
  while (logArea.children.length > 200) logArea.removeChild(logArea.firstChild);
}

function spawnFloatText(text, color) {
  const area = document.getElementById('battle-area');
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color;
  el.style.left = (40 + Math.random() * 20) + '%';
  el.style.top = '40%';
  area.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

// ============ SAVE/LOAD ============
function saveGame() {
  if (G.gameOver) return;
  const saveData = {
    floor: G.floor, node: G.node,
    hp: G.hp, maxHp: G.maxHp, shield: G.shield, shieldBroken: G.shieldBroken,
    spirit: G.spirit, gold: G.gold,
    wordStates: G.wordStates, mastered: G.mastered,
    permanentMastered: G.permanentMastered,
    map: G.map.map(n => ({...n, wordIndices: [...n.wordIndices]})),
    currentNodeMonsters: G.currentNodeMonsters.map(m => ({...m})),
    currentTargetIdx: G.currentTargetIdx,
    inventory: [...G.inventory], lensActive: G.lensActive,
    bossFight: G.bossFight, bossHp: G.bossHp, bossMaxHp: G.bossMaxHp,
    bossWords: [...G.bossWords], totalWrong: G.totalWrong,
    startTime: G.startTime,
  };
  try { localStorage.setItem('abyss_dict_save', JSON.stringify(saveData)); } catch(e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem('abyss_dict_save');
    if (!raw) return false;
    const d = JSON.parse(raw);
    G.floor = d.floor; G.node = d.node; G.hp = d.hp; G.maxHp = d.maxHp;
    G.shield = d.shield; G.shieldBroken = d.shieldBroken;
    G.spirit = d.spirit; G.gold = d.gold;
    G.wordStates = d.wordStates; G.mastered = d.mastered || [];
    G.permanentMastered = d.permanentMastered || [];
    G.map = d.map; G.currentNodeMonsters = d.currentNodeMonsters || [];
    G.currentTargetIdx = d.currentTargetIdx || 0;
    G.inventory = d.inventory || []; G.lensActive = d.lensActive || false;
    G.bossFight = d.bossFight || false; G.bossHp = d.bossHp || 0;
    G.bossMaxHp = d.bossMaxHp || 0; G.bossWords = d.bossWords || [];
    G.totalWrong = d.totalWrong || 0; G.startTime = d.startTime || Date.now();
    G.gameOver = false;
    return true;
  } catch(e) { return false; }
}

function loadMastered() {
  try {
    const raw = localStorage.getItem('abyss_dict_mastered');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveMastered() {
  const all = [...new Set([...G.permanentMastered, ...G.mastered])];
  try { localStorage.setItem('abyss_dict_mastered', JSON.stringify(all)); } catch(e) {}
}

function clearSave() {
  try { localStorage.removeItem('abyss_dict_save'); } catch(e) {}
}

// ============ VICTORY / DEFEAT ============
function victory() {
  G.gameOver = true;
  clearSave();
  // All current mastered become permanent
  G.permanentMastered = [...new Set([...G.permanentMastered, ...G.mastered])];
  G.mastered = [];
  saveMastered();

  const elapsed = Math.floor((Date.now() - G.startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  const totalMastered = G.permanentMastered.length;
  const isFullClear = totalMastered >= 100;

  document.getElementById('game-screen').style.display = 'none';
  const overlay = document.getElementById('overlay-container');
  overlay.innerHTML = `
    <div class="overlay">
      <h2>${isFullClear ? '🏆 Hall of Eternity' : '🌟 You Escaped the Abyss!'}</h2>
      <p>${isFullClear ? 'Congratulations! All 100 words mastered!' : 'Floor 5 cleared! All words recorded in Codex.'}</p>
      <p>Codex Progress: ${totalMastered} / 100</p>
      <p>Total Errors：${G.totalWrong} | Time：${mins}分${secs}秒</p>
      ${isFullClear ? '<p style="color:var(--gold);font-size:1.2em;">FULL CLEAR ACHIEVEMENT UNLOCKED!</p>' : ''}
      <button onclick="location.reload()">${isFullClear ? 'Enter Again' : 'Continue'}</button>
    </div>`;
}

function gameOver_defeat() {
  G.gameOver = true;
  clearSave();
  // Keep mastered words
  G.permanentMastered = [...new Set([...G.permanentMastered, ...G.mastered])];
  saveMastered();

  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('overlay-container').innerHTML = `
    <div class="overlay">
      <h2>💀 The Abyss consumed you...</h2>
      <p>HP reached 0. Mastered words saved to Codex.</p>
      <p>学识录进度：${G.permanentMastered.length} / 100</p>
      <button onclick="location.reload()">Try Again</button>
    </div>`;
}

// ============ PARTICLES ============
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      size: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.1,
      opacity: Math.random() * 0.5 + 0.1,
    });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y -= p.speed;
      if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      ctx.fillStyle = `rgba(201,160,80,${p.opacity})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
}

// ============ INITIALIZATION ============
function init() {
  initParticles();
  const mastered = loadMastered();
  if (mastered.length > 0) {
    G.permanentMastered = mastered;
    document.getElementById('mastered-count-display').textContent = `Codex: ${mastered.length} / 100`;
  }

  // Check for saved game
  if (localStorage.getItem('abyss_dict_save')) {
    document.getElementById('overlay-container').innerHTML = `
      <div class="overlay">
        <h2>📜 Continue your journey?</h2>
        <p>An unfinished journey awaits.</p>
        <button onclick="resumeGame()">继续</button>
        <button onclick="newGame()" style="border-color:var(--text-dim);color:var(--text-dim);">New Game</button>
      </div>`;
  }

  // Focus input on game
  document.addEventListener('click', () => {
    if (document.getElementById('game-screen').style.display === 'flex') {
      document.getElementById('cmd-input').focus();
    }
  });
}

function resumeGame() {
  document.getElementById('overlay-container').innerHTML = '';
  if (loadGame()) {
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    updateDisplay();
    renderMap();
    if (G.bossFight) {
      renderBattle();
      renderBossBattle();
    } else if (G.currentNodeMonsters.length > 0) {
      renderBattle();
    } else {
      const node = G.map[G.node];
      if (node.type === 'shop') startShop(node);
      else if (node.type === 'event') startEvent(node);
      else {
        document.getElementById('battle-scene').innerHTML = '';
      }
    }
    focusInput();
  }
}

function newGame() {
  clearSave();
  document.getElementById('overlay-container').innerHTML = '';
}

init();
</script>
