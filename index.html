<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyss Lexicon: Card of the Abyss</title>
<style>
/* ============ VARIABLES & RESET ============ */
:root {
  --bg: #0a0a0f; --surface: #12121a; --border: #1e1e30;
  --gold: #c9a050; --gold-dim: #6b4e20;
  --red: #c0392b; --red-glow: #e74c3c;
  --blue: #2980b9; --green: #27ae60; --purple: #8e44ad;
  --text: #c8c8d0; --text-dim: #6a6a7a;
  --terminal-bg: #08080f;
  --def-color: #3498db; --off-color: #e74c3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  height:100vh; overflow:hidden; user-select:none;
}

/* ============ PARTICLES ============ */
#particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

/* ============ TITLE SCREEN ============ */
#title-screen {
  position:fixed; inset:0; z-index:100; background:radial-gradient(ellipse at center, #1a1020 0%, #0a0a0f 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
#title-screen h1 { font-size:3em; color:var(--gold); text-shadow:0 0 40px rgba(201,160,80,0.5); letter-spacing:0.1em; margin-bottom:0.3em; }
#title-screen .subtitle { color:var(--text-dim); font-size:1.1em; margin-bottom:2em; }
#title-screen button {
  background:transparent; color:var(--gold); border:2px solid var(--gold);
  padding:1em 3em; font-size:1.3em; cursor:pointer; letter-spacing:0.1em;
  transition:all 0.3s; border-radius:4px; margin-top:1em;
}
#title-screen button:hover { background:var(--gold); color:var(--bg); box-shadow:0 0 30px rgba(201,160,80,0.4); }
#title-screen .info { color:var(--text-dim); font-size:0.85em; margin-top:1.5em; text-align:center; line-height:1.6; }

/* ============ GAME SCREEN LAYOUT ============ */
#game-screen { display:none; height:100vh; flex-direction:column; position:relative; z-index:1; }

/* --- Status Bar --- */
#status-bar {
  display:flex; gap:14px; align-items:center; padding:6px 16px;
  background:rgba(10,10,15,0.95); border-bottom:1px solid var(--border);
  font-size:0.82em; color:var(--text-dim); flex-shrink:0; flex-wrap:wrap;
}
#status-bar .stat { display:flex; align-items:center; gap:3px; }
#status-bar .stat .icon { font-size:1.1em; }
#status-bar .stat .val { color:var(--text); font-weight:bold; }
#deck-viewer-btn { margin-left:auto; background:transparent; color:var(--gold); border:1px solid var(--gold-dim); padding:4px 12px; cursor:pointer; border-radius:4px; font-size:0.85em; transition:all 0.3s; }
#deck-viewer-btn:hover { background:var(--gold); color:var(--bg); }

/* --- Map Bar --- */
#map-bar {
  padding:6px 16px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(20,10,30,0.9) 0%, rgba(10,10,15,0.95) 100%);
  flex-shrink:0; display:flex; align-items:center; gap:8px;
}
#map-label { color:var(--text-dim); font-size:0.8em; white-space:nowrap; }
#map-label span { color:var(--gold); }
#map-nodes { display:flex; align-items:center; gap:4px; overflow-x:auto; flex:1; padding:2px 0; }
.map-node {
  min-width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.65em; font-weight:bold; flex-shrink:0; border:2px solid transparent;
  transition:all 0.3s; background:rgba(10,10,20,0.8);
}
.map-node.current { border-color:var(--gold); box-shadow:0 0 15px rgba(201,160,80,0.6); animation:pulse-node 1.5s infinite; }
.map-node.visited { opacity:0.45; }
.map-node.cleared { opacity:0.3; }
.map-node.hidden { border-color:#333; color:#555; background:rgba(10,10,15,0.5); }
.map-node.battle { border-color:#c0392b; color:#e74c3c; }
.map-node.elite { border-color:#ff0000; color:#ff4444; }
.map-node.boss { border-color:#ff0000; color:#ff4444; min-width:36px; height:36px; font-size:0.8em; background:#200808; }
.map-node.event { border-color:#2980b9; color:#3498db; }
.map-node.shop { border-color:#c9a050; color:#f1c40f; }
.map-node.rest { border-color:#27ae60; color:#2ecc71; }
.map-node.spring { border-color:#8e44ad; color:#9b59b6; }
.map-path { min-width:16px; height:2px; background:var(--border); flex-shrink:0; border-radius:1px; }
.map-path.active { background:var(--gold); }
@keyframes pulse-node { 0%,100%{box-shadow:0 0 15px rgba(201,160,80,0.6);} 50%{box-shadow:0 0 30px rgba(201,160,80,1);} }

/* --- Battle Field --- */
#battle-field { flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }

#monster-zone {
  display:flex; align-items:center; justify-content:center; gap:20px;
  padding:12px 16px; flex-wrap:wrap; min-height:40%; flex-shrink:0;
}

#field-divider { height:2px; background:linear-gradient(90deg, transparent, var(--border), transparent); margin:0 20px; flex-shrink:0; }

#hand-zone {
  display:flex; align-items:center; justify-content:center; gap:16px;
  padding:8px 16px; flex:1; flex-wrap:wrap; align-content:center;
  position:relative;
}
#end-turn-wrap { width:100%; text-align:center; margin-top:8px; }
#end-turn-btn {
  background:transparent; color:var(--text-dim); border:1px solid var(--border);
  padding:6px 24px; cursor:pointer; border-radius:4px; font-size:0.85em; transition:all 0.3s;
}
#end-turn-btn:hover { border-color:var(--gold); color:var(--gold); }

/* --- Input Bar --- */
#input-bar { display:flex; align-items:center; padding:6px 16px; background:var(--terminal-bg); border-top:1px solid var(--border); flex-shrink:0; }
#input-bar .prompt { color:var(--gold); font-family:'Consolas',monospace; margin-right:8px; font-weight:bold; }
#cmd-input { flex:1; background:transparent; border:none; color:#e8e8f0; font-family:'Consolas',monospace; font-size:1em; outline:none; caret-color:var(--gold); }
#cmd-input::placeholder { color:var(--text-dim); }
#cmd-input:disabled { opacity:0.4; }

/* --- Log Area --- */
#log-area { height:20vh; overflow-y:auto; font-family:'Consolas','Courier New',monospace; font-size:0.78em; padding:4px 16px; background:var(--terminal-bg); flex-shrink:0; border-top:1px solid var(--border); }
.log-line { padding:2px 0; animation:fadeInLog 0.3s; }
.log-line.system { color:var(--text-dim); }
.log-line.correct { color:#2ecc71; }
.log-line.wrong { color:#e74c3c; }
.log-line.gold { color:#f1c40f; }
.log-line.info { color:#3498db; }
@keyframes fadeInLog { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

/* ============ GAME CARDS ============ */
.game-card {
  width:150px; min-height:190px;
  background:linear-gradient(145deg, #1a1a2e, #12122a);
  border:2px solid var(--border); border-radius:10px;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; transition:all 0.3s; position:relative;
  padding:12px 8px 28px 8px;
}
.game-card:hover { transform:translateY(-8px); box-shadow:0 8px 25px rgba(201,160,80,0.3); border-color:var(--gold); }
.game-card.selected {
  border-color:var(--gold); box-shadow:0 0 30px rgba(201,160,80,0.55);
  transform:translateY(-12px);
}
.game-card.defensive { border-top:5px solid var(--def-color); }
.game-card.offensive { border-top:5px solid var(--off-color); }
.game-card .card-word { font-size:1.25em; color:#e8e8f0; text-align:center; margin:4px 0; padding:0 4px; word-break:break-word; font-weight:bold; }
.game-card .card-badge { font-size:0.7em; padding:2px 8px; border-radius:8px; margin:4px 0; }
.game-card .card-badge.defensive { background:rgba(52,152,219,0.2); color:var(--def-color); }
.game-card .card-badge.offensive { background:rgba(231,76,60,0.2); color:var(--off-color); }
.game-card .card-stars { position:absolute; bottom:6px; color:var(--gold); font-size:0.8em; letter-spacing:1px; }

/* ============ MONSTERS ============ */
.monster-card {
  width:150px; padding:12px; background:rgba(25,10,10,0.9);
  border:2px solid #5a1a1a; border-radius:10px; text-align:center;
  transition:all 0.3s; cursor:pointer;
}
.monster-card.targeted { border-color:var(--gold); box-shadow:0 0 20px rgba(201,160,80,0.4); }
.monster-card:hover { border-color:#c0392b; box-shadow:0 0 15px rgba(192,57,43,0.3); }
.monster-card.defeated { opacity:0.25; filter:grayscale(1); pointer-events:none; }
.monster-card .monster-name { font-size:1em; color:#e8c8c8; margin-bottom:2px; font-weight:bold; }
.monster-card .monster-icon { font-size:1.8em; margin:2px 0; }
.monster-hp-bar { width:100%; height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden; margin:6px 0; }
.monster-hp-fill { height:100%; background:linear-gradient(90deg, #c0392b, #e74c3c); transition:width 0.4s; border-radius:4px; }
.monster-card .monster-atk { font-size:0.75em; color:#e74c3c; }
.monster-card.elite { border-color:#ff0000; background:rgba(30,5,5,0.95); }
.monster-card.boss { border-color:#ff4444; background:rgba(30,2,2,0.95); box-shadow:0 0 12px rgba(255,0,0,0.2); }

/* ============ OVERLAYS ============ */
.overlay {
  position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.9);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.overlay h2 { color:var(--gold); font-size:2em; margin-bottom:0.5em; text-shadow:0 0 30px rgba(201,160,80,0.5); }
.overlay p { color:var(--text-dim); margin-bottom:0.8em; text-align:center; max-width:500px; line-height:1.5; }
.overlay button {
  background:transparent; color:var(--gold); border:1px solid var(--gold);
  padding:0.8em 2em; font-size:1em; cursor:pointer; margin:0.4em; border-radius:4px; transition:all 0.3s;
}
.overlay button:hover { background:var(--gold); color:var(--bg); }
.overlay button.danger { border-color:var(--red); color:var(--red); }
.overlay button.danger:hover { background:var(--red); color:#fff; }

/* ============ DECK VIEWER ============ */
#deck-viewer-overlay {
  position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.93);
  display:none; flex-direction:column; overflow-y:auto; padding:30px 20px;
}
#deck-viewer-overlay h2 { color:var(--gold); text-align:center; margin-bottom:6px; }
#deck-viewer-stats { text-align:center; color:var(--text-dim); font-size:0.85em; margin-bottom:12px; }
#deck-viewer-toolbar { display:flex; gap:10px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
#deck-viewer-toolbar button {
  background:transparent; color:var(--text-dim); border:1px solid var(--border);
  padding:5px 14px; cursor:pointer; border-radius:4px; font-size:0.82em; transition:all 0.3s;
}
#deck-viewer-toolbar button:hover, #deck-viewer-toolbar button.active { border-color:var(--gold); color:var(--gold); }
.deck-grid { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:1100px; margin:0 auto; }
.flashcard {
  width:170px; height:240px; cursor:pointer; perspective:800px;
}
.flashcard-inner {
  position:relative; width:100%; height:100%; transition:transform 0.5s; transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform:rotateY(180deg); }
.flashcard-front, .flashcard-back {
  position:absolute; width:100%; height:100%; backface-visibility:hidden;
  border-radius:10px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:14px 10px; border:2px solid var(--border); text-align:center;
}
.flashcard-front { background:linear-gradient(145deg, #1a1a2e, #12122a); }
.flashcard-back { background:linear-gradient(145deg, #2d1b2e, #1a1a2e); transform:rotateY(180deg); }
.flashcard.defensive .flashcard-front { border-top:5px solid var(--def-color); }
.flashcard.offensive .flashcard-front { border-top:5px solid var(--off-color); }
.flashcard .fc-word { font-size:1.2em; color:#e8e8f0; margin-bottom:6px; font-weight:bold; }
.flashcard-back .fc-word { color:var(--gold); font-size:1.1em; }
.flashcard .fc-sentence { font-size:0.6em; color:var(--text-dim); line-height:1.3; margin-bottom:6px; }
.flashcard .fc-badge { font-size:0.65em; padding:2px 8px; border-radius:6px; }
.flashcard .fc-badge.defensive { background:rgba(52,152,219,0.2); color:var(--def-color); }
.flashcard .fc-badge.offensive { background:rgba(231,76,60,0.2); color:var(--off-color); }
.flashcard .fc-stars { color:var(--gold); font-size:0.75em; margin-top:4px; letter-spacing:1px; }
.flashcard .fc-meaning { color:var(--gold); font-size:1em; margin-bottom:6px; }
.flashcard .fc-sc { font-size:0.6em; color:var(--text-dim); line-height:1.3; }

/* ============ SHOP ============ */
#shop-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:8px; }
.shop-item {
  background:rgba(20,15,25,0.9); border:1px solid var(--border); border-radius:8px;
  padding:12px; width:170px; text-align:center; transition:all 0.3s;
}
.shop-item:hover { border-color:var(--gold); }
.shop-item .shop-name { color:var(--gold); font-weight:bold; font-size:0.95em; }
.shop-item .shop-desc { font-size:0.72em; color:var(--text-dim); margin:6px 0; line-height:1.3; }
.shop-item .shop-price { color:#f1c40f; font-size:0.9em; margin-bottom:6px; }
.shop-item button {
  background:rgba(201,160,80,0.15); color:var(--gold); border:1px solid var(--gold-dim);
  padding:4px 14px; cursor:pointer; border-radius:4px; font-size:0.82em; transition:all 0.3s;
}
.shop-item button:hover { background:var(--gold); color:var(--bg); }
.shop-item button:disabled { opacity:0.3; cursor:default; }

/* ============ EVENT / NON-COMBAT ============ */
#scene-area { text-align:center; padding:20px; }
#scene-area .scene-icon { font-size:3em; margin-bottom:10px; }
#scene-area .scene-title { color:var(--gold); font-size:1.3em; margin-bottom:6px; }
#scene-area .scene-desc { color:var(--text-dim); font-size:0.9em; margin-bottom:14px; max-width:500px; margin-left:auto; margin-right:auto; line-height:1.4; }
#scene-area .scene-flavor { color:var(--text-dim); font-size:0.8em; font-style:italic; margin-bottom:10px; }
#choice-buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
#choice-buttons button {
  background:rgba(30,20,40,0.9); color:var(--text); border:1px solid var(--border);
  padding:10px 16px; cursor:pointer; border-radius:6px; transition:all 0.3s; font-size:0.88em; max-width:280px; text-align:left; line-height:1.3;
}
#choice-buttons button:hover { border-color:var(--gold); color:var(--gold); transform:translateY(-2px); }
#choice-buttons button .choice-label { color:var(--gold); font-weight:bold; margin-right:6px; }

/* ============ ANIMATIONS ============ */
.float-text { position:absolute; pointer-events:none; font-weight:bold; font-size:1.2em; animation:floatUp 1.5s forwards; z-index:50; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-80px);} }
.shake { animation:shake 0.5s; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.flash-red { animation:flashRed 0.3s; }
@keyframes flashRed { 0%,100%{background:transparent;} 50%{background:rgba(231,76,60,0.2);} }

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* ============ RESPONSIVE ============ */
@media (max-width:700px) {
  .game-card { width:110px; min-height:150px; padding:8px 4px 22px 4px; }
  .game-card .card-word { font-size:1em; }
  .monster-card { width:120px; padding:8px; }
  #status-bar { font-size:0.72em; gap:8px; }
  .flashcard { width:140px; height:200px; }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <h1>Abyss Lexicon</h1>
  <p class="subtitle">Card of the Abyss</p>
  <p class="info">⚔️ 100 SAT words split into offensive & defensive cards<br>🛡️ Play cards by translating — master all 100 to win<br>📚 Build your deck, survive the descent</p>
  <button onclick="startGame()">Enter the Abyss</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <!-- Status Bar -->
  <div id="status-bar">
    <span class="stat"><span class="icon">❤️</span> <span class="val" id="hp-val">20</span>/<span id="maxhp-val">20</span></span>
    <span class="stat"><span class="icon">🛡️</span> <span class="val" id="armor-val">0</span></span>
    <span class="stat"><span class="icon">📊</span> Lv.<span class="val" id="level-val">1</span></span>
    <span class="stat"><span class="icon">🪙</span> <span class="val" id="gold-val">0</span></span>
    <span class="stat"><span class="icon">📖</span> Deck: <span class="val" id="deck-val">10</span></span>
    <span class="stat"><span class="icon">⭐</span> <span class="val" id="mastered-val">0</span>/100</span>
    <button id="deck-viewer-btn" onclick="openDeckViewer()">📚 View Deck</button>
  </div>

  <!-- Map Bar -->
  <div id="map-bar">
    <span id="map-label">▸ <span>Level <span id="map-level">1</span></span> · <span id="map-progress">1/20</span></span>
    <div id="map-nodes"></div>
  </div>

  <!-- Battle Field -->
  <div id="battle-field">
    <div id="monster-zone"></div>
    <div id="field-divider"></div>
    <div id="hand-zone">
      <div id="end-turn-wrap"><button id="end-turn-btn" onclick="endTurn()">End Turn ⏎</button></div>
    </div>
  </div>

  <!-- Input Bar -->
  <div id="input-bar">
    <span class="prompt">&gt;</span>
    <input id="cmd-input" type="text" placeholder="Click a card, type Chinese meaning..." autocomplete="off" spellcheck="false" disabled>
  </div>

  <!-- Log Area -->
  <div id="log-area"></div>
</div>

<!-- DECK VIEWER OVERLAY -->
<div id="deck-viewer-overlay">
  <h2>📚 Your Deck</h2>
  <div id="deck-viewer-stats"></div>
  <div id="deck-viewer-toolbar">
    <button onclick="filterDeckViewer('all')" id="dv-filter-all" class="active">All</button>
    <button onclick="filterDeckViewer('defensive')" id="dv-filter-defensive">🛡️ Defensive</button>
    <button onclick="filterDeckViewer('offensive')" id="dv-filter-offensive">⚔️ Offensive</button>
    <button onclick="sortDeckViewer('stars')" id="dv-sort-stars">Sort: Stars</button>
    <button onclick="sortDeckViewer('alpha')" id="dv-sort-alpha">Sort: A-Z</button>
    <button onclick="flipAllCards()">Flip All</button>
  </div>
  <div class="deck-grid" id="deck-grid"></div>
  <div style="text-align:center;margin-top:16px;">
    <button onclick="closeDeckViewer()" style="background:transparent;color:var(--gold);border:1px solid var(--gold);padding:8px 24px;cursor:pointer;border-radius:4px;">Close</button>
  </div>
</div>

<!-- GENERIC OVERLAY -->
<div id="overlay-container"></div>

<script>
// ============ WORD DATA ============

// ============ UTILITIES ============
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomWeighted(items, weights) {
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length-1];
}

function checkAnswer(input, acceptableAnswers) {
  if (!acceptableAnswers || acceptableAnswers.length === 0) return false;
  const normalized = input.toLowerCase().replace(/\s+/g,'');
  return acceptableAnswers.some(a => {
    const an = a.toLowerCase().replace(/\s+/g,'');
    return normalized.includes(an) || an.includes(normalized);
  });
}

// ============ LOGGING & UI HELPERS ============
function logSystem(msg) { logLine(msg, 'system'); }
function logLine(msg, cls) {
  const logArea = document.getElementById('log-area');
  const div = document.createElement('div');
  div.className = 'log-line ' + (cls || 'system');
  div.innerHTML = msg;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
  while (logArea.children.length > 200) logArea.removeChild(logArea.firstChild);
}

function spawnFloatText(text, color) {
  const area = document.getElementById('battle-field');
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color;
  el.style.left = (40 + Math.random() * 20) + '%';
  el.style.top = '45%';
  area.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function updateDisplay() {
  document.getElementById('hp-val').textContent = G.hp;
  document.getElementById('maxhp-val').textContent = G.maxHp;
  document.getElementById('armor-val').textContent = G.armor;
  document.getElementById('level-val').textContent = G.level;
  document.getElementById('gold-val').textContent = G.gold;
  document.getElementById('deck-val').textContent = G.deck.length;
  document.getElementById('mastered-val').textContent = G.masteredCount;
  document.getElementById('map-level').textContent = G.level;
  document.getElementById('map-progress').textContent = (G.nodeIdx + 1) + '/' + NODES_PER_LEVEL;
  // Enable/disable deck viewer button
  const dvBtn = document.getElementById('deck-viewer-btn');
  if (dvBtn) dvBtn.style.display = (G.battleInProgress && !G._trainingMode) ? 'none' : '';
}

function focusInput() {
  const inp = document.getElementById('cmd-input');
  if (inp) { inp.focus(); inp.value = ''; }
}

// ============ CARD SYSTEM ============
function categorizeWords() {
  const indices = WORD_DATA.map((_, i) => i);
  shuffle(indices);
  G.wordTypeMap = {};
  for (let i = 0; i < 50; i++) G.wordTypeMap[indices[i]] = 'defensive';
  for (let i = 50; i < 100; i++) G.wordTypeMap[indices[i]] = 'offensive';
}

function buildInitialDeck() {
  const defIndices = WORD_DATA.map((_, i) => i).filter(i => G.wordTypeMap[i] === 'defensive');
  const offIndices = WORD_DATA.map((_, i) => i).filter(i => G.wordTypeMap[i] === 'offensive');
  shuffle(defIndices); shuffle(offIndices);
  const picked = [...defIndices.slice(0, 5), ...offIndices.slice(0, 5)];
  shuffle(picked);
  G.deck = picked.map(i => ({ wordIndex: i, type: G.wordTypeMap[i], stars: 0 }));
  G.deck.forEach(c => G.usedWordIndices.add(c.wordIndex));
}

function getUnusedWordIndices() {
  return WORD_DATA.map((_, i) => i).filter(i => !G.usedWordIndices.has(i));
}

function addCardsToDeck(count) {
  const unused = getUnusedWordIndices();
  if (unused.length === 0) return 0;
  shuffle(unused);
  const toAdd = unused.slice(0, Math.min(count, unused.length));
  toAdd.forEach(i => {
    G.deck.push({ wordIndex: i, type: G.wordTypeMap[i], stars: 0 });
    G.usedWordIndices.add(i);
  });
  shuffle(G.deck);
  return toAdd.length;
}

function drawHand() {
  const cardsNeeded = CARDS_PER_TURN + G.nextBattleBonusDraws - G.hand.length;
  const toDraw = Math.max(0, cardsNeeded);
  for (let i = 0; i < toDraw; i++) {
    if (G.deck.length === 0) {
      // Reshuffle discard pile into deck
      if (G.discardPile.length === 0) break;
      G.deck = shuffle([...G.discardPile]);
      G.discardPile = [];
    }
    G.hand.push(G.deck.pop());
  }
  G.selectedCardIdx = -1;
}

function getDeckCardByWordIndex(wordIndex) {
  return G.deck.find(c => c.wordIndex === wordIndex);
}

function removeCardFromDeck(wordIndex) {
  G.deck = G.deck.filter(c => c.wordIndex !== wordIndex);
}

// ============ MONSTER SYSTEM ============
function getMonsterCount() { return Math.min(MAX_MONSTERS, 1 + Math.floor((G.level - 1) / 4)); }
function getMonsterHP() { return 4 + Math.floor(G.level * 1.3); }
function getMonsterATK() { return 1 + Math.floor((G.level - 1) / 3); }
function isEliteLevel() { return G.level % 5 === 0; }

function spawnMonsters() {
  const count = getMonsterCount();
  let hp = getMonsterHP();
  let atk = getMonsterATK();
  G.monsters = [];
  for (let i = 0; i < count; i++) {
    const nameIdx = (G.level * 7 + i * 3) % MONSTER_NAMES.length;
    const iconIdx = (G.level * 3 + i * 5) % MONSTER_ICONS.length;
    G.monsters.push({
      name: MONSTER_NAMES[nameIdx],
      icon: MONSTER_ICONS[iconIdx],
      hp: hp, maxHp: hp, atk: atk, defeated: false,
    });
  }
  // Elite/boss boost (last node = boss, node 18 = elite on elite levels)
  const node = G.nodes[G.nodeIdx];
  if (node && (node.type === 'elite' || node.type === 'boss')) {
    const mult = node.type === 'boss' ? 2.0 : 1.5;
    G.monsters.forEach(m => {
      m.hp = Math.floor(m.hp * mult);
      m.maxHp = m.hp;
      m.atk = Math.floor(m.atk * mult);
    });
    if (node.type === 'boss' && G.monsters.length === 1) {
      G.monsters[0].name = 'Abyss Lord';
      G.monsters[0].icon = '👹';
    }
  }
  G.selectedTargetIdx = 0;
}

// ============ COMBAT SYSTEM ============
function startBattle() {
  G.battleInProgress = true;
  G.battleCardsUsed = [];
  G.discardPile = [];
  G.hand = [];
  G.armor = G.nextBattleBonusArmor;
  G.nextBattleBonusArmor = 0;
  spawnMonsters();
  logSystem('═══ Battle begins! ═══');
  if (G.armor > 0) logSystem(`Iron Rune: +${G.armor} starting armor.`);
  beginTurn();
}

function beginTurn() {
  G.armor = 0; // Armor from previous turn decays
  drawHand();
  G.selectedCardIdx = -1;
  updateDisplay();
  renderBattle();
  if (G.hand.length === 0) {
    logSystem('No cards to draw. Monsters attack freely!');
    setTimeout(() => monsterPhase(), 600);
    return;
  }
  enableInput();
  focusInput();
}

function selectCard(idx) {
  if (!G.battleInProgress && !G._trainingMode) return;
  G.selectedCardIdx = idx;
  renderBattle();
  focusInput();
}

function selectMonster(idx) {
  if (!G.battleInProgress) return;
  const monster = G.monsters[idx];
  if (monster && !monster.defeated) {
    G.selectedTargetIdx = idx;
    renderBattle();
    focusInput();
  }
}

function endTurn() {
  if (!G.battleInProgress && !G._trainingMode) return;
  // Discard remaining hand cards
  G.discardPile.push(...G.hand.map(c => ({ wordIndex: c.wordIndex, type: c.type, stars: c.stars })));
  G.hand = [];
  G.selectedCardIdx = -1;
  disableInput();
  renderBattle();
  logSystem('Turn ended.');
  setTimeout(() => monsterPhase(), 400);
}

function handleCardAnswer(input) {
  if (G._trainingMode) { handleTrainingInput(input); return; }
  if (!G.battleInProgress) return;
  if (G.selectedCardIdx < 0 || G.selectedCardIdx >= G.hand.length) {
    logSystem('Click a card first.');
    focusInput();
    return;
  }

  const card = G.hand[G.selectedCardIdx];
  const word = WORD_DATA[card.wordIndex];
  const isCorrect = checkAnswer(input, word.a);

  if (isCorrect) {
    // Apply effect
    if (card.type === 'defensive') {
      G.armor += 1;
      logLine(`✓ Correct! "${word.w}" — +1 Armor (now ${G.armor})`, 'correct');
      spawnFloatText('+1 🛡️', '#3498db');
    } else {
      const target = G.monsters[G.selectedTargetIdx];
      if (target && !target.defeated) {
        target.hp -= 1;
        logLine(`✓ Correct! "${word.w}" — 1 damage to ${target.name}`, 'correct');
        spawnFloatText('-1', '#e74c3c');
        if (target.hp <= 0) {
          target.defeated = true;
          target.hp = 0;
          logLine(`💀 ${target.name} defeated!`, 'gold');
          spawnFloatText('Defeated!', '#c9a050');
        }
      } else {
        // Target already dead, find new one
        const alive = G.monsters.find(m => !m.defeated);
        if (alive) {
          alive.hp -= 1;
          G.selectedTargetIdx = G.monsters.indexOf(alive);
          logLine(`✓ Correct! "${word.w}" — 1 damage to ${alive.name}`, 'correct');
          if (alive.hp <= 0) { alive.defeated = true; alive.hp = 0; logLine(`💀 ${alive.name} defeated!`, 'gold'); }
        }
      }
    }
    // Track for post-battle stars
    if (!G.battleCardsUsed.includes(card.wordIndex)) {
      G.battleCardsUsed.push(card.wordIndex);
    }
    // Return card to deck (unless mastered later)
    G.deck.push(card);
  } else {
    // Wrong: discard for this battle (store full card to preserve stars)
    G.discardPile.push({ wordIndex: card.wordIndex, type: card.type, stars: card.stars });
    G.totalWrong++;
    logLine(`✗ Wrong! "${word.w}" = ${word.m} — Card discarded for this battle.`, 'wrong');
    document.getElementById('battle-field').classList.add('shake');
    setTimeout(() => document.getElementById('battle-field').classList.remove('shake'), 500);
    spawnFloatText('Discarded', '#e74c3c');
  }

  // Remove card from hand
  G.hand.splice(G.selectedCardIdx, 1);
  G.selectedCardIdx = -1;
  updateDisplay();
  renderBattle();

  // Check if all monsters dead
  if (G.monsters.every(m => m.defeated)) {
    disableInput();
    setTimeout(() => endBattle_victory(), 500);
    return;
  }

  // If hand empty, go to monster phase
  if (G.hand.length === 0) {
    disableInput();
    setTimeout(() => monsterPhase(), 400);
  } else {
    focusInput();
  }
}

function monsterPhase() {
  if (!G.battleInProgress && !G._trainingMode) return;
  let totalDmg = 0;
  for (const monster of G.monsters) {
    if (monster.defeated) continue;
    const damage = Math.max(0, monster.atk - G.armor);
    const blocked = Math.min(G.armor, monster.atk);
    if (damage > 0) {
      G.hp -= damage;
      totalDmg += damage;
      logLine(`💀 ${monster.name} attacks! ${blocked > 0 ? '('+blocked+' absorbed by armor) ' : ''}${damage} damage taken. HP: ${G.hp}`, 'wrong');
    } else {
      logLine(`🛡️ ${monster.name} attacks! All ${monster.atk} damage absorbed by armor.`, 'info');
    }
    G.armor = Math.max(0, G.armor - monster.atk);
    if (G.hp <= 0) { gameOver_defeat(); return; }
  }
  if (totalDmg > 0) {
    document.getElementById('battle-field').classList.add('flash-red');
    setTimeout(() => document.getElementById('battle-field').classList.remove('flash-red'), 300);
  }
  updateDisplay();
  renderBattle();
  // Next turn
  setTimeout(() => beginTurn(), 600);
}

function endBattle_victory() {
  G.battleInProgress = false;
  G._trainingMode = false;
  G.discardPile = []; // Return all discards by not actually tracking them
  // Return discarded cards to deck (preserve their star counts)
  G.deck.push(...G.discardPile);
  G.discardPile = [];
  G.hand = [];
  G.selectedCardIdx = -1;
  G.nextBattleBonusDraws = 0;

  // Award stars
  const starEarned = G.battleCardsUsed.length;
  let masteredThisBattle = 0;
  const masteredWords = [];

  G.battleCardsUsed.forEach(wi => {
    const card = getDeckCardByWordIndex(wi);
    if (card) {
      card.stars += 1;
      if (card.stars >= STARS_TO_MASTER) {
        removeCardFromDeck(wi);
        G.masteredCount++;
        masteredThisBattle++;
        masteredWords.push(WORD_DATA[wi].w);
      }
    }
  });

  // Gold reward
  const baseGold = G.monsters.length * 2;
  const eliteBonus = (G.nodes[G.nodeIdx] && (G.nodes[G.nodeIdx].type === 'elite' || G.nodes[G.nodeIdx].type === 'boss')) ? Math.floor(baseGold * 0.5) : 0;
  const goldEarned = baseGold + eliteBonus;
  G.gold += goldEarned;

  logSystem(`═══ Battle won! ═══`);
  logLine(`⭐ ${starEarned} card(s) earned a star!`, 'gold');
  if (masteredThisBattle > 0) {
    logLine(`🌟 Mastered: ${masteredWords.join(', ')} (${G.masteredCount}/100)`, 'gold');
  }
  logLine(`🪙 +${goldEarned} gold`, 'gold');

  G.battleCardsUsed = [];

  // Add new cards from word bank
  const added = addCardsToDeck(POST_BATTLE_CARDS);
  if (added > 0) logLine(`📖 ${added} new cards added to deck from the word bank.`, 'info');

  updateDisplay();
  renderBattle();

  if (G.masteredCount >= 100) { victory(); return; }
  setTimeout(() => advanceNode(), 1500);
}

function getCardStars(wordIndex) {
  const card = G.deck.find(c => c.wordIndex === wordIndex);
  return card ? card.stars : 0;
}

// ============ MAP SYSTEM ============
function generateLevel() {
  const types = [];
  for (const [type, weight] of Object.entries(NODE_WEIGHTS)) {
    for (let i = 0; i < weight; i++) types.push(type);
  }
  const nodes = [];
  // Node 0: always rest (safe start)
  nodes.push({ type: 'rest', visited: false, cleared: false });
  // Nodes 1-17: random
  for (let i = 1; i <= 17; i++) {
    const t = types[Math.floor(Math.random() * types.length)];
    nodes.push({ type: t, visited: false, cleared: false });
  }
  // Node 18: battle or elite
  nodes.push({ type: isEliteLevel() ? 'elite' : 'battle', visited: false, cleared: false });
  // Node 19: boss
  nodes.push({ type: 'boss', visited: false, cleared: false });
  return nodes;
}

function renderMap() {
  const container = document.getElementById('map-nodes');
  let html = '';
  for (let i = 0; i < G.nodes.length; i++) {
    const node = G.nodes[i];
    const revealed = i <= G.nodeIdx + 2; // current + next 2 visible
    let cls = 'map-node';
    let icon = '?';

    if (revealed) {
      cls += ' ' + node.type;
      if (i === G.nodeIdx) cls += ' current';
      if (node.visited) cls += ' visited';
      if (node.cleared) cls += ' cleared';
      const icons = { battle:'⚔', elite:'💀', boss:'👹', event:'?', shop:'$', rest:'♨', spring:'💧' };
      icon = icons[node.type] || '?';
    } else {
      cls += ' hidden';
    }

    html += `<div class="${cls}" title="Room ${i+1}: ${revealed ? node.type : '???'}">${icon}</div>`;
    if (i < G.nodes.length - 1) {
      const pathCls = (i >= G.nodeIdx - 1 && i <= G.nodeIdx) ? 'map-path active' : 'map-path';
      html += `<div class="${pathCls}"></div>`;
    }
  }
  container.innerHTML = html;
  const currentEl = container.querySelector('.current');
  if (currentEl) currentEl.scrollIntoView({ behavior: 'smooth', inline: 'center' });
}

function enterNode(idx) {
  G.nodeIdx = idx;
  const node = G.nodes[idx];
  node.visited = true;
  G.battleInProgress = false;
  G._shopMode = false;
  G._eventMode = false;
  G._trainingMode = false;
  G.hand = [];
  G.monsters = [];
  disableInput();
  renderMap();
  updateDisplay();
  renderBattle();

  switch (node.type) {
    case 'battle': case 'elite': case 'boss': startBattleNode(); break;
    case 'event': startEventNode(); break;
    case 'shop': startShopNode(); break;
    case 'rest': startRestNode(); break;
    case 'spring': startSpringNode(); break;
    default: advanceNode();
  }
}

function advanceNode() {
  G.nodes[G.nodeIdx].cleared = true;
  if (G.nodeIdx >= NODES_PER_LEVEL - 1) {
    // Level complete
    G.level++;
    G.nodes = generateLevel();
    G.nodeIdx = -1;
    logSystem(`═══ Descending deeper... Level ${G.level} ═══`);
    updateDisplay();
    renderMap();
    renderBattle();
    document.getElementById('monster-zone').innerHTML = '';
    setTimeout(() => enterNode(0), 1200);
    return;
  }
  setTimeout(() => enterNode(G.nodeIdx + 1), 400);
}

// ============ BATTLE NODE ============
function startBattleNode() {
  const node = G.nodes[G.nodeIdx];
  const typeLabels = { battle:'⚔️ Battle', elite:'💀 Elite Battle', boss:'👹 Boss Battle' };
  const scene = document.getElementById('monster-zone');

  logSystem(`——— ${typeLabels[node.type] || 'Battle'} · Level ${G.level} · Room ${G.nodeIdx+1} ———`);
  setTimeout(() => startBattle(), 800);
}

// ============ TRAINING MODE ============
function startTrainingMode() {
  G._trainingMode = true;
  G.battleInProgress = false;
  const trainingPool = shuffle([...G.deck]).slice(0, Math.min(3, G.deck.length));
  if (trainingPool.length === 0) { logSystem('No cards to practice!'); G._trainingMode = false; G.nodes[G.nodeIdx].cleared = true; setTimeout(() => advanceNode(), 800); return; }
  G._trainingCards = trainingPool.map(c => c.wordIndex);
  G.hand = trainingPool.map(c => ({ wordIndex: c.wordIndex, type: c.type, stars: c.stars }));
  G.selectedCardIdx = -1;
  logSystem('🎯 Training: no damage, no stars. Practice freely!');
  renderBattle();
  enableInput();
  focusInput();
}

function handleTrainingInput(input) {
  if (G.selectedCardIdx < 0 || G.selectedCardIdx >= G.hand.length) { logSystem('Click a card first.'); focusInput(); return; }
  const card = G.hand[G.selectedCardIdx];
  const word = WORD_DATA[card.wordIndex];
  const isCorrect = checkAnswer(input, word.a);
  if (isCorrect) {
    logLine(`✓ Correct! "${word.w}" = ${word.m}`, 'correct');
  } else {
    logLine(`✗ "${word.w}" = ${word.m} (no penalty in training)`, 'info');
  }
  G.hand.splice(G.selectedCardIdx, 1);
  G.selectedCardIdx = -1;
  renderBattle();
  if (G.hand.length === 0) {
    G._trainingMode = false;
    G.hand = [];
    logSystem('Training complete.');
    G.nodes[G.nodeIdx].cleared = true;
    disableInput();
    renderBattle();
    setTimeout(() => advanceNode(), 1000);
  } else {
    focusInput();
  }
}

      <div class="shop-desc">${item.desc}</div>
      <div class="shop-price">🪙 ${item.price}</div>
      <button onclick="buyItem('${item.id}',${item.price})" ${canBuy ? '' : 'disabled'}>Buy [${i+1}]</button>
    </div>`;
  });
  html += `</div><div style="margin-top:10px;color:var(--text-dim);">Type 1-6 to buy, or "leave" to exit</div></div>`;
  mz.innerHTML = html;
  document.getElementById('hand-zone').innerHTML = '';
  disableInput();
  enableInput(); // Re-enable for shop commands
  focusInput();
}

function buyItem(id, price) {
  if (G.gold < price) { logSystem('Not enough gold!'); return; }
  G.gold -= price;
  switch (id) {
    case 'star_scroll':
      if (G.deck.length === 0) { logSystem('Deck empty! Refunded.'); G.gold += price; return; }
      const card = G.deck[Math.floor(Math.random() * G.deck.length)];
      card.stars += 1;
      logSystem(`⭐ Star Scroll: "${WORD_DATA[card.wordIndex].w}" +1 star (now ${card.stars}).`);
      if (card.stars >= STARS_TO_MASTER) { removeCardFromDeck(card.wordIndex); G.masteredCount++; logLine(`🌟 Mastered! (${G.masteredCount}/100)`, 'gold'); }
      if (G.masteredCount >= 100) { G._shopMode = false; victory(); return; }
      break;
    case 'health_potion':
      G.hp = Math.min(G.maxHp, G.hp + 4);
      logSystem(`❤️ +4 HP. HP: ${G.hp}/${G.maxHp}`);
      break;
    case 'iron_rune':
      G.nextBattleBonusArmor += 2;
      logSystem('🛡️ Iron Rune: +2 starting armor for next battle.');
      break;
    case 'quick_wit':
      G.nextBattleBonusDraws += 1;
      logSystem('⚡ Quick Wit: Draw 4 cards/turn next battle.');
      break;
    case 'forge_hammer':
      startForgeMode();
      return; // Don't refresh shop
    case 'oblivion_dust':
      const zeroStars = G.deck.filter(c => c.stars === 0);
      if (zeroStars.length === 0) { logSystem('No 0-star cards! Refunded.'); G.gold += price; return; }
      const removed = zeroStars[Math.floor(Math.random() * zeroStars.length)];
      removeCardFromDeck(removed.wordIndex);
      G.gold += 3;
      logSystem(`💨 Oblivion Dust: Removed "${WORD_DATA[removed.wordIndex].w}" (+3g refund).`);
      break;
  }
  updateDisplay();
  startShopNode(); // Refresh
}

function startForgeMode() {
  G._forgeMode = true;
  G._shopMode = false;
  const cards = [...G.deck];
  const mz = document.getElementById('monster-zone');
  let html = `<div style="text-align:center;padding:10px;"><div style="color:var(--gold);font-size:1.1em;margin-bottom:8px;">🔨 Pick a card to convert:</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">`;
  cards.forEach((c, i) => {
    const w = WORD_DATA[c.wordIndex];
    html += `<div class="game-card ${c.type}" onclick="forgeCard(${i})" style="cursor:pointer;width:130px;min-height:140px;padding:8px;">
      <div class="card-word" style="font-size:1em;">${w.w}</div>
      <div class="card-badge ${c.type}">${c.type==='defensive'?'🛡️ Def':'⚔️ Off'}</div>
      <div class="card-stars">${'★'.repeat(c.stars)}${'☆'.repeat(Math.max(0,3-c.stars))}</div>
    </div>`;
  });
  html += `</div><div style="text-align:center;margin-top:10px;"><button onclick="cancelForge()" style="background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:6px 16px;cursor:pointer;border-radius:4px;">Cancel</button></div></div>`;
  mz.innerHTML = html;
  document.getElementById('hand-zone').innerHTML = '';
  disableInput();
}

function forgeCard(idx) {
  const card = G.deck[idx];
  card.type = card.type === 'defensive' ? 'offensive' : 'defensive';
  G.wordTypeMap[card.wordIndex] = card.type;
  logSystem(`🔨 "${WORD_DATA[card.wordIndex].w}" converted to ${card.type==='defensive'?'🛡️ Defensive':'⚔️ Offensive'}!`);
  G._forgeMode = false;
  G._shopMode = true;
  updateDisplay();
  startShopNode();
}

function cancelForge() {
  G._forgeMode = false;
  G._shopMode = true;
  startShopNode();
}

function handleShopInput(input) {
  const cmd = input.toLowerCase().trim();
  if (cmd === 'leave' || cmd === 'exit' || cmd === 'q' || cmd === '离开') {
    G._shopMode = false;
    G.nodes[G.nodeIdx].cleared = true;
    document.getElementById('monster-zone').innerHTML = '';
    document.getElementById('hand-zone').innerHTML = '<div id="end-turn-wrap"><button id="end-turn-btn" onclick="endTurn()">End Turn ⏎</button></div>';
    disableInput();
    updateDisplay();
    setTimeout(() => advanceNode(), 500);
    return;
  }
  const num = parseInt(cmd);
  if (num >= 1 && num <= 6) {
    const item = SHOP_ITEMS[num-1];
    buyItem(item.id, item.price);
    return;
  }
  logSystem('Type 1-6 to buy, or "leave" to exit.');
  focusInput();
}

// ============ REST NODE ============
function startRestNode() {
  const heal = Math.max(2, Math.floor(G.maxHp * 0.2));
  G.hp = Math.min(G.maxHp, G.hp + heal);
  logSystem(`🛌 Rested... restored ${heal} HP. HP: ${G.hp}/${G.maxHp}`);
  const mz = document.getElementById('monster-zone');
  mz.innerHTML = `<div id="scene-area">
    <div class="scene-icon">🛌</div>
    <div class="scene-title">Quiet Sanctuary</div>
    <div class="scene-desc">Restored ${heal} HP.</div>
    <button onclick="openDeckViewer()" style="background:transparent;color:var(--gold);border:1px solid var(--gold);padding:8px 20px;cursor:pointer;border-radius:4px;">📚 Study Deck</button>
  </div>`;
  document.getElementById('hand-zone').innerHTML = '';
  disableInput();
  G.nodes[G.nodeIdx].cleared = true;
  updateDisplay();
  setTimeout(() => advanceNode(), 1500);
}

// ============ SPRING NODE ============
function startSpringNode() {
  if (G.deck.length === 0) { logSystem('💧 Memory Spring: deck empty, nothing happens.'); }
  else {
    const card = G.deck[Math.floor(Math.random() * G.deck.length)];
    card.stars += 1;
    logSystem(`💧 Memory Spring: "${WORD_DATA[card.wordIndex].w}" +1 star (now ${card.stars}).`);
    if (card.stars >= STARS_TO_MASTER) { removeCardFromDeck(card.wordIndex); G.masteredCount++; logLine(`🌟 Mastered! (${G.masteredCount}/100)`, 'gold'); }
  }
  const mz = document.getElementById('monster-zone');
  mz.innerHTML = `<div id="scene-area"><div class="scene-icon">💧</div><div class="scene-title">Memory Spring</div><div class="scene-desc">A random card gained 1 star.</div></div>`;
  document.getElementById('hand-zone').innerHTML = '';
  disableInput();
  G.nodes[G.nodeIdx].cleared = true;
  updateDisplay();
  if (G.masteredCount >= 100) { victory(); return; }
  setTimeout(() => advanceNode(), 1000);
}

// ============ INPUT HANDLING ============
function enableInput() {
  const inp = document.getElementById('cmd-input');
  inp.disabled = false;
  inp.placeholder = G._shopMode ? 'Type 1-6 to buy, or "leave"...' :
    G._trainingMode ? 'Practice — type Chinese meaning...' :
    'Click a card, type Chinese meaning...';
}

function disableInput() {
  const inp = document.getElementById('cmd-input');
  inp.disabled = true;
  inp.value = '';
}

document.getElementById('cmd-input').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  const input = this.value.trim();
  if (!input) return;
  this.value = '';
  if (G._shopMode) { handleShopInput(input); return; }
  if (G._forgeMode) return;
  if (G._eventMode) return;
  if (G.gameOver) return;
  handleCardAnswer(input);
});

// Use health potion from inventory
function useHealthPotion() {
  if (!G.inventory.includes('health_potion')) { logSystem('No health potions in inventory.'); return; }
  G.inventory = G.inventory.filter(i => i !== 'health_potion');
  G.hp = Math.min(G.maxHp, G.hp + 3);
  logSystem(`🧪 Used Health Potion! +3 HP. HP: ${G.hp}/${G.maxHp}`);
  updateDisplay();
}

// ============ DECK VIEWER ============
let deckViewerFilter = 'all';
let deckViewerSort = 'stars';

function openDeckViewer() {
  if (G.battleInProgress && !G._trainingMode) { logSystem('Cannot view deck during combat!'); return; }
  G._deckViewerOpen = true;
  document.getElementById('deck-viewer-overlay').style.display = 'flex';
  renderDeckViewer();
}

function closeDeckViewer() {
  G._deckViewerOpen = false;
  document.getElementById('deck-viewer-overlay').style.display = 'none';
}

function filterDeckViewer(filter) {
  deckViewerFilter = filter;
  document.querySelectorAll('#deck-viewer-toolbar button').forEach(b => b.classList.remove('active'));
  document.getElementById('dv-filter-' + filter).classList.add('active');
  renderDeckViewer();
}

function sortDeckViewer(sort) {
  deckViewerSort = sort;
  document.querySelectorAll('#deck-viewer-toolbar button').forEach(b => b.classList.remove('active'));
  document.getElementById('dv-sort-' + sort).classList.add('active');
  renderDeckViewer();
}

function flipAllCards() {
  document.querySelectorAll('.flashcard').forEach(c => c.classList.toggle('flipped'));
}

function flipCard(el) {
  el.closest('.flashcard').classList.toggle('flipped');
}

function renderDeckViewer() {
  let cards = [...G.deck];
  if (deckViewerFilter === 'defensive') cards = cards.filter(c => c.type === 'defensive');
  if (deckViewerFilter === 'offensive') cards = cards.filter(c => c.type === 'offensive');
  if (deckViewerSort === 'stars') cards.sort((a, b) => b.stars - a.stars || WORD_DATA[a.wordIndex].w.localeCompare(WORD_DATA[b.wordIndex].w));
  if (deckViewerSort === 'alpha') cards.sort((a, b) => WORD_DATA[a.wordIndex].w.localeCompare(WORD_DATA[b.wordIndex].w));

  const defCount = G.deck.filter(c => c.type === 'defensive').length;
  const offCount = G.deck.filter(c => c.type === 'offensive').length;
  const remaining = getUnusedWordIndices().length;
  document.getElementById('deck-viewer-stats').innerHTML =
    `Deck: ${G.deck.length} cards (${defCount}🛡️ / ${offCount}⚔️) | Mastered: ${G.masteredCount}/100 | Word Bank: ${remaining} remaining`;

  const grid = document.getElementById('deck-grid');
  let html = '';
  cards.forEach(c => {
    const w = WORD_DATA[c.wordIndex];
    html += `<div class="flashcard ${c.type}" onclick="flipCard(this)">
      <div class="flashcard-inner">
        <div class="flashcard-front">
          <div class="fc-word">${w.w}</div>
          <div class="fc-sentence">${w.s || ''}</div>
          <div class="fc-badge ${c.type}">${c.type==='defensive'?'🛡️ Defensive':'⚔️ Offensive'}</div>
          <div class="fc-stars">${'★'.repeat(c.stars)}${'☆'.repeat(Math.max(0,STARS_TO_MASTER-c.stars))}</div>
        </div>
        <div class="flashcard-back">
          <div class="fc-meaning">${w.m}</div>
          <div class="fc-sc">${w.sc || ''}</div>
          <div class="fc-stars">${'★'.repeat(c.stars)}${'☆'.repeat(Math.max(0,STARS_TO_MASTER-c.stars))}</div>
        </div>
      </div>
    </div>`;
  });
  if (cards.length === 0) html = '<div style="color:var(--text-dim);text-align:center;width:100%;">No cards to show.</div>';
  grid.innerHTML = html;
}

// Close deck viewer with Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && G._deckViewerOpen) { closeDeckViewer(); }
  if (e.key === 'h' && !G.battleInProgress && !G._shopMode && !G._eventMode && !G._deckViewerOpen && !G._forgeMode) {
    useHealthPotion();
  }
});

// ============ BATTLE RENDERING ============
function renderBattle() {
  if (G.gameOver) return;

  // Monster zone
  const mz = document.getElementById('monster-zone');
  if (G.monsters.length > 0) {
    let mhtml = '';
    G.monsters.forEach((m, i) => {
      const isTarget = i === G.selectedTargetIdx && !m.defeated;
      const hpPct = m.maxHp > 0 ? (m.hp / m.maxHp * 100) : 0;
      const isElite = G.nodes[G.nodeIdx] && (G.nodes[G.nodeIdx].type === 'elite' || G.nodes[G.nodeIdx].type === 'boss');
      mhtml += `<div class="monster-card ${m.defeated ? 'defeated' : ''} ${isTarget ? 'targeted' : ''} ${isElite ? (G.nodes[G.nodeIdx].type==='boss'?'boss':'elite') : ''}" onclick="selectMonster(${i})">
        <div class="monster-icon">${m.icon}</div>
        <div class="monster-name">${m.name}</div>
        <div class="monster-hp-bar"><div class="monster-hp-fill" style="width:${hpPct}%;"></div></div>
        <div style="font-size:0.7em;color:var(--text-dim);">HP: ${m.hp}/${m.maxHp}</div>
        <div class="monster-atk">⚔️ ATK: ${m.atk}</div>
        ${isTarget ? '<div style="color:var(--gold);font-size:0.7em;">◈ Targeted</div>' : ''}
      </div>`;
    });
    mz.innerHTML = mhtml;
    document.getElementById('field-divider').style.display = '';
  } else if (!G._shopMode && !G._eventMode) {
    mz.innerHTML = '';
    document.getElementById('field-divider').style.display = 'none';
  }

  // Hand zone
  const hz = document.getElementById('hand-zone');
  if ((G.battleInProgress || G._trainingMode) && G.hand.length > 0) {
    let hhtml = '';
    G.hand.forEach((c, i) => {
      const w = WORD_DATA[c.wordIndex];
      const isSelected = i === G.selectedCardIdx;
      hhtml += `<div class="game-card ${c.type} ${isSelected ? 'selected' : ''}" onclick="selectCard(${i})">
        <div class="card-word">${w.w}</div>
        <div class="card-badge ${c.type}">${c.type === 'defensive' ? '🛡️ Defensive' : '⚔️ Offensive'}</div>
        <div class="card-stars">${'★'.repeat(c.stars)}${'☆'.repeat(Math.max(0, STARS_TO_MASTER - c.stars))}</div>
      </div>`;
    });
    hhtml += '<div id="end-turn-wrap"><button id="end-turn-btn" onclick="endTurn()">End Turn ⏎</button></div>';
    hz.innerHTML = hhtml;
  } else if (!G._shopMode && !G._eventMode && !G._forgeMode) {
    hz.innerHTML = '<div id="end-turn-wrap"><button id="end-turn-btn" onclick="endTurn()">End Turn ⏎</button></div>';
  }
}

// ============ GAME FLOW ============
function startGame() {
  resetGameState();
  categorizeWords();
  buildInitialDeck();
  G.nodes = generateLevel();
  G.nodeIdx = -1;

  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  document.getElementById('overlay-container').innerHTML = '';

  logSystem('═══ Welcome to the Abyss Lexicon ═══');
  logSystem(`Deck: ${G.deck.length} cards (5🛡️ Def / 5⚔️ Off)`);
  logSystem('Play cards by typing their Chinese meaning.');
  logSystem('Master all 100 words to conquer the abyss!');

  updateDisplay();
  renderMap();
  renderBattle();
  enterNode(0);
}

function victory() {
  G.gameOver = true;
  G.victory = true;
  G.battleInProgress = false;
  disableInput();
  document.getElementById('game-screen').style.display = 'none';
  const elapsed = Math.floor((Date.now() - G.startTime) / 1000);
  const overlay = document.getElementById('overlay-container');
  overlay.innerHTML = `<div class="overlay">
    <h2>🏆 All 100 Words Mastered!</h2>
    <p>You have conquered the Abyss Lexicon!</p>
    <p>Level reached: ${G.level} | Time: ${Math.floor(elapsed/60)}m ${elapsed%60}s</p>
    <button onclick="location.reload()">Play Again</button>
  </div>`;
}

function gameOver_defeat() {
  G.gameOver = true;
  G.battleInProgress = false;
  disableInput();
  document.getElementById('game-screen').style.display = 'none';
  const overlay = document.getElementById('overlay-container');
  overlay.innerHTML = `<div class="overlay">
    <h2>💀 The Abyss Consumed You...</h2>
    <p>Level reached: ${G.level} | Words mastered: ${G.masteredCount}/100</p>
    <p>Deck size: ${G.deck.length} cards</p>
    <button onclick="location.reload()">Try Again</button>
  </div>`;
}

// ============ PARTICLES ============
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, size:Math.random()*2+1, speed:Math.random()*0.5+0.1, opacity:Math.random()*0.5+0.1 });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y -= p.speed;
      if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
      ctx.fillStyle = `rgba(201,160,80,${p.opacity})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
}

// ============ INIT ============
initParticles();
</script>
